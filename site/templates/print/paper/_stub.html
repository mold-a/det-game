{# Заглушка: для документа kind: paper нет content/paper/<id>.md. В --release — ошибка. #}
<article class="paper paper--stub" id="doc-{{ doc.id }}" data-doc="{{ doc.id }}" data-form="stub">
  <div class="stub__no">Документ {{ doc.id }}: текст не готов</div>
  <div class="stub__title">{{ doc.doc_title }}</div>
  <div class="stub__note">Конверт {{ doc.stage }}, нет файла content/paper/{{ doc.id }}.md</div>
</article>
