# Лаборатория — Центр судебных экспертиз «Призма» (REDESIGN-2026-10 §2–3).
# Заявка = предмет (свободный текст → распознавание по aliases и title) + вид + основание (+ параметры).
# Предмет не распознан среди доступных → «нельзя передать в лабораторию» (без штрафа).
# Распознан, но записи нет → «Экспертиза ничего не выявила», штраф penalties.lab_no_basis.
# Результаты без `doc` — «атмосферные»: короткий текст, документ не добавляется.
# Правило 2.1.4: если object.from_stage < stage результата, все bases — документы этапа результата.
# Объекты и алиасы — сценарист 21.10.2026 (docs/drafts/lab/expertise-objects.yaml).

objects:
  # ================= нужные объекты (есть результаты) =================

  # Ингалятор в описи 1-09 нет (SCENARIO 1-09: [ЗАПРЕЩЕНО]); он появляется в карте СМП 1-03 («передан полиции»).
  # Оставлен from_stage: 2, как в SCENARIO («экспертиза ингалятора открывается на этапе 2») и во вводной этапа 2
  # («В лаборатории появились новые объекты»). Иначе (from_stage 1) по правилу 2.1.4 его основаниями мог бы быть
  # только 2-02, а самые естественные основания 1-03 и 1-08 пришлось бы убрать. На этапе 1 «ингалятор» →
  # «нельзя передать» (без штрафа).
  - id: inhaler
    title: "Ингалятор погибшего (найден в кулисе)"
    ref: "1-03"
    from_stage: 2
    aliases: ["ингалят", "баллон", "аэрозол", "спрей"]

  # REDESIGN §2.2: в описи 1-09, поз. 17.3 → from_stage 1; основания результатов — только документы этапа 3.
  # «таблет» ловит и «таблетница», и «таблетки»: отдельной позиции «таблетки» в описях нет, а игроки так назовут
  # именно таблетницу (таблетки лежат в ней). Других предметов с таблетками в описях нет (упаковка на фото 2-06
  # в опись не входит), поэтому «таблетки» → таблетница однозначно. «коробочк» — так её называет 3-01.
  - id: pillbox
    title: "Таблетница недельная, чёрная, пластиковая"
    ref: "1-09, поз. 17.3"
    from_stage: 1
    aliases: ["таблет", "лекарств", "пилюл", "недельн", "коробочк", "органайз"]

  # Кровь не входит ни в одну опись: образцы отобраны при вскрытии и хранятся в бюро СМЭ (1-04). «Передать» их
  # можно с этапа 3: вводная этапа 3 — «Лаборатория готова работать с образцами». from_stage 3 = этап результата,
  # поэтому основания 1-04 и 2-02 остаются законными; подсказка s3.q1 («основание 3-01 или 2-02») не ломается.
  # title не менять: на него ссылается подсказка s3.q1.
  - id: blood
    title: "Образцы крови погибшего"
    ref: "1-04"
    from_stage: 3
    aliases: ["кров", "образц", "биоматер"]

  - id: water
    title: "Бутылка питьевой воды пластиковая, 0,5 л"
    ref: "1-09, поз. 11"
    from_stage: 1
    aliases: ["бутыл", "вода", "воды", "воду", "водой", "питьев"]   # не «вод»: поймает «водитель»

  # Прежний «Сценический костюм погибшего» (ловушка без результатов) привязан к описи: костюм 1-го действия.
  # Костюм 2-го действия был на теле — в описях его нет.
  - id: costume
    title: "Костюм сценический для 1-го действия: фрак, жилет, сорочка"
    ref: "1-09, поз. 4"
    from_stage: 1
    aliases: ["костюм", "фрак", "жилет", "сорочк"]

  # Телефона в описи 1-09 нет — это улика (зарядка висит пустая). from_stage 4 (REDESIGN §2.2): до этапа 4
  # «телефон» → «нельзя передать». ref — где игрок видит номер.
  - id: phone
    title: "Телефон погибшего"
    ref: "3-03, абонентский номер"
    from_stage: 4
    aliases: ["телефон", "мобильн", "смартфон", "сотов", "абонент", "номер"]

  # Камера в коридоре — на плане 1-06 («неисправна»), этап 1.
  - id: theater_cam
    title: "Камера в коридоре гримёрок"
    ref: "1-06"
    from_stage: 1
    aliases: ["камер коридор", "камер гример", "камер театр", "видеокамер коридор", "видеокамер гример", "видеонаблюд коридор", "видеонаблюд гример", "видеонаблюд театр", "коридор гример"]

  # Вокзал — из билета 3-07 (этап 3), но запрос и результат — этап 4 (SCENARIO). from_stage = этап результата,
  # основание 3-07 законно. Голое «камер» у theater_cam убрано (S-67): до этапа 4 «камеры вокзала» → «нельзя передать».
  - id: station_cam
    title: "Камеры железнодорожного вокзала"
    ref: "3-07"
    from_stage: 4
    aliases: ["вокзал", "камер вокзал", "касс"]
    params:
      - { id: date, type: date, label: "Дата" }
      - { id: time, type: time, label: "Время" }
      - { id: window, type: number, label: "Номер кассы" }

  # ================= 1-09: опись гримёрной № 4 (этап 1), пустышки =================
  - { id: coat, title: "Пальто мужское чёрное, шерстяное", ref: "1-09, поз. 1", from_stage: 1, aliases: ["пальто"] }
  - { id: scarf, title: "Шарф шерстяной серый", ref: "1-09, поз. 2", from_stage: 1, aliases: ["шарф"] }
  - { id: keys, title: "Связка ключей на брелоке в виде театральной маски", ref: "1-09, поз. 3", from_stage: 1, aliases: ["ключ", "связк", "брелок"] }
  # поз. 4 — costume (выше)
  - { id: shoes, title: "Туфли мужские чёрные, 4 пары", ref: "1-09, поз. 5", from_stage: 1, aliases: ["туфл", "обув", "ботин"] }
  - { id: jacket, title: "Пиджак мужской тёмно-синий", ref: "1-09, поз. 6", from_stage: 1, aliases: ["пиджак"] }
  - { id: wallet, title: "Бумажник кожаный чёрный с деньгами, банковскими картами и пропуском", ref: "1-09, поз. 7", from_stage: 1, aliases: ["бумажник", "кошел", "портмоне", "пропуск", "банковск", "деньг"] }
  - { id: watch, title: "Часы наручные мужские на кожаном ремешке", ref: "1-09, поз. 8", from_stage: 1, aliases: ["часы", "наручн", "ремеш"] }
  # «грим» как основа невозможна: поймает «гримёрка». Ловим «набор грима», «кейс с гримом», «грима», «гримом».
  - { id: makeup, title: "Набор грима в металлическом кейсе, кисти, спонжи", ref: "1-09, поз. 9", from_stage: 1, aliases: ["кейс", "грима", "гримом", "набор грим", "кист", "спонж", "косметик"] }
  - { id: comb, title: "Расчёска", ref: "1-09, поз. 10", from_stage: 1, aliases: ["расческ", "гребен", "гребеш"] }
  # поз. 11 — water (выше)
  - { id: script, title: "Текст роли «{{ w.play.role_main }}», машинопись, с пометками карандашом", ref: "1-09, поз. 12", from_stage: 1, aliases: ["текст рол", "роли", "роль", "машинопис", "пометк", "сценари", "пьес", "распечатк"] }
  - { id: charger, title: "Зарядное устройство для мобильного телефона с кабелем", ref: "1-09, поз. 13", from_stage: 1, aliases: ["заряд", "кабел", "провод", "шнур"] }
  - { id: earphones, title: "Наушники беспроводные в зарядном футляре", ref: "1-09, поз. 14", from_stage: 1, aliases: ["наушник", "гарнитур", "заряд футляр", "футляр наушн"] }
  - { id: napkins, title: "Упаковка бумажных салфеток, начатая", ref: "1-09, поз. 15", from_stage: 1, aliases: ["салфет"] }
  - { id: photo, title: "Фотография в деревянной рамке", ref: "1-09, поз. 16", from_stage: 1, aliases: ["фото", "рамк", "снимок"] }
  - { id: bag, title: "Сумка мужская кожаная коричневая", ref: "1-09, поз. 17", from_stage: 1, aliases: ["сумк", "портфел", "барсет"] }
  - { id: glasses, title: "Очки в футляре, оправа прозрачная", ref: "1-09, поз. 17.1", from_stage: 1, aliases: ["очк", "футляр", "оправ"] }
  - { id: book, title: "Книга К. С. Станиславского «Моя жизнь в искусстве», с закладкой", ref: "1-09, поз. 17.2", from_stage: 1, aliases: ["книг", "станиславск", "жизн искусств"] }
  # поз. 17.3 — pillbox (выше)
  - { id: pen, title: "Ручка шариковая синяя", ref: "1-09, поз. 17.4", from_stage: 1, aliases: ["ручк шарик", "ручк син", "авторучк", "шарик"] }
  - { id: umbrella, title: "Зонт складной чёрный", ref: "1-09, поз. 17.5", from_stage: 1, aliases: ["зонт"] }
  # «роз» нельзя: поймает «розетку».
  - { id: flowers, title: "Букет роз в пластиковом ведре, открытка «С премьерой! Труппа»", ref: "1-09, поз. 18", from_stage: 1, aliases: ["букет", "розы", "цвет", "ведр", "открытк"] }
  - { id: plaid, title: "Плед шерстяной клетчатый", ref: "1-09, поз. 19", from_stage: 1, aliases: ["плед"] }
  - { id: candies, title: "Коробка шоколадных конфет, вскрыта", ref: "1-09, поз. 20", from_stage: 1, aliases: ["конфет", "шоколад", "коробк"] }

  # ================= 2-08: опись-сверка костюмерного цеха (этап 2), пустышки =================
  # Только позиции «в наличии». № 7 (брошь), 10 (шаль), 11 (перчатки) «не обнаружены» — в лабораторию передать нечего.
  - { id: halfmasks, title: "Полумаски бархатные чёрные, 12 шт.", ref: "2-08, поз. 1", from_stage: 2, aliases: ["полумаск", "бархат"] }
  - { id: mask, title: "Маска венецианская с перьями", ref: "2-08, поз. 2", from_stage: 2, aliases: ["маск", "венециан", "перь"] }
  - { id: fan_white, title: "Веер страусовый белый", ref: "2-08, поз. 3", from_stage: 2, aliases: ["веер", "страус"] }
  - { id: fan_black, title: "Веер кружевной чёрный", ref: "2-08, поз. 4", from_stage: 2, aliases: ["веер черн", "веер кружев", "кружев"] }
  - { id: bracelets, title: "Браслеты «золото» с подвесками (бутафория), 2 шт.", ref: "2-08, поз. 5", from_stage: 2, aliases: ["браслет"] }
  - { id: earrings, title: "Серьги-подвески «жемчуг»", ref: "2-08, поз. 6", from_stage: 2, aliases: ["серьг", "жемчуг"] }
  - { id: necklace, title: "Колье «бриллианты» (стразы)", ref: "2-08, поз. 8", from_stage: 2, aliases: ["колье", "ожерель", "бриллиант", "страз"] }
  - { id: lorgnette, title: "Лорнет на цепочке", ref: "2-08, поз. 9", from_stage: 2, aliases: ["лорнет", "цепочк"] }
  - { id: palantine, title: "Палантин газовый голубой", ref: "2-08, поз. 12", from_stage: 2, aliases: ["палантин"] }
  - { id: hairflowers, title: "Цветы в причёску (букетики), 6 шт.", ref: "2-08, поз. 13", from_stage: 2, aliases: ["букетик", "цвет причес", "причес"] }
  - { id: rings, title: "Кольца «с камнями» (бутафория), 8 шт.", ref: "2-08, поз. 14", from_stage: 2, aliases: ["кольц", "перстн", "перстен"] }

  # ================= 2-06: осмотр кабинета художественного руководителя (этап 2), пустышки =================
  # Предметы перечислены в тексте фототаблицы («на рабочем столе, среди прочего»); не изымались, как и почти всё в 1-09.
  - { id: fund_folder, title: "Папка-скоросшиватель «Фонд „{{ w.money.fund }}“: отчёт для администрации города» (кабинет худрука)", ref: "2-06", from_stage: 2, aliases: ["папк", "скоросшив", "отчет"] }
  - { id: diary, title: "Ежедневник (кабинет худрука)", ref: "2-06", from_stage: 2, aliases: ["ежедневник", "блокнот"] }
  - { id: desk_set, title: "Письменный прибор (кабинет худрука)", ref: "2-06", from_stage: 2, aliases: ["прибор"] }
  - { id: desk_glasses, title: "Очки (рабочий стол худрука)", ref: "2-06", from_stage: 2, aliases: ["очк кабинет", "очк худрук", "очк стол"] }
  - { id: lamp, title: "Настольная лампа (кабинет худрука)", ref: "2-06", from_stage: 2, aliases: ["ламп"] }
  - { id: desk_phone, title: "Стационарный телефон (кабинет худрука)", ref: "2-06", from_stage: 2, aliases: ["стационар", "телефон кабинет", "телефон худрук"] }
  - { id: cups, title: "Две чашки на блюдцах с остатками кофе (кабинет худрука)", ref: "2-06", from_stage: 2, aliases: ["чашк", "блюдц", "кофе"] }

  # ================= 2-03: видеозапись наружной камеры (этап 2), пустышка =================
  # Запись изъята 12.11 (2-03), кадры уже в деле. Без объекта «наружная камера» распознавалась бы как камера
  # коридора (до 21.10, S-67: алиасы theater_cam теперь только сочетания). Результата нет — см. предложение proposed_results.outer-cam ниже.
  - { id: outer_cam, title: "Видеозапись наружной камеры над служебным входом", ref: "2-03", from_stage: 2, aliases: ["наружн", "камер наружн", "камер вход", "камер служебн", "видеорегистр", "регистратор"] }

  # ================= 3-08: осмотр автомобиля водителя и чемодана (этап 3), пустышки =================
  - { id: car, title: "Легковой автомобиль (седан) водителя погибшего", ref: "3-08", from_stage: 3, aliases: ["автомоб", "машин", "седан", "салон"] }
  - { id: car_plaid, title: "Плед в клетку (салон автомобиля)", ref: "3-08, салон", from_stage: 3, aliases: ["плед машин", "плед автомоб", "плед салон"] }
  - { id: car_napkins, title: "Упаковка бумажных салфеток (салон автомобиля)", ref: "3-08, салон", from_stage: 3, aliases: ["салфет машин", "салфет автомоб", "салфет салон"] }
  - { id: car_umbrella, title: "Зонт складной (салон автомобиля)", ref: "3-08, салон", from_stage: 3, aliases: ["зонт машин", "зонт автомоб", "зонт салон"] }
  - { id: thermos, title: "Термокружка с остатками чая (салон автомобиля)", ref: "3-08, салон", from_stage: 3, aliases: ["термокружк", "термос", "чай машин", "чай автомоб", "чай салон"] }
  - { id: car_docs, title: "Документы на автомобиль (бардачок)", ref: "3-08, салон", from_stage: 3, aliases: ["документ машин", "документ автомоб", "бардач", "техпаспорт"] }
  - { id: car_charger, title: "Зарядное устройство для телефона (бардачок автомобиля)", ref: "3-08, салон", from_stage: 3, aliases: ["заряд машин", "заряд автомоб", "заряд бардач"] }
  - { id: suitcase, title: "Чемодан на колёсах, тёмно-синий, тканевый", ref: "3-08, багажник", from_stage: 3, aliases: ["чемодан", "багаж"] }
  - { id: shirts, title: "Рубашки мужские, 5 шт. (из чемодана)", ref: "3-08, п. 1", from_stage: 3, aliases: ["рубаш", "рубах", "одежд"] }
  - { id: trousers, title: "Брюки мужские, 2 шт. (из чемодана)", ref: "3-08, п. 2", from_stage: 3, aliases: ["брюк", "штан"] }
  - { id: sweater, title: "Свитер шерстяной серый (из чемодана)", ref: "3-08, п. 3", from_stage: 3, aliases: ["свитер"] }
  - { id: underwear, title: "Бельё и носки мужские, 5 комплектов (из чемодана)", ref: "3-08, п. 4", from_stage: 3, aliases: ["бель", "носк"] }
  - { id: pajamas, title: "Пижама (из чемодана)", ref: "3-08, п. 5", from_stage: 3, aliases: ["пижам"] }
  - { id: slippers, title: "Тапочки домашние (из чемодана)", ref: "3-08, п. 6", from_stage: 3, aliases: ["тапоч", "тапк"] }
  - { id: toiletry, title: "Несессер: бритва, зубная щётка, зубная паста, расчёска, крем для бритья", ref: "3-08, п. 7", from_stage: 3, aliases: ["несессер", "бритв", "щетк", "паст", "крем", "расческ несессер", "расческ чемодан"] }
  - { id: spare_inhaler, title: "Ингалятор аэрозольный дозированный в заводской упаковке (из чемодана)", ref: "3-08, п. 8", from_stage: 3, aliases: ["ингалят чемодан", "запасн ингалят", "ингалят упаковк", "ингалят заводск", "нов ингалят", "втор ингалят"] }
  - { id: doc_folder, title: "Папка пластиковая с документами: паспорт, медицинский полис, удостоверение народного артиста", ref: "3-08, п. 9", from_stage: 3, aliases: ["документ", "папк документ", "паспорт", "полис", "удостоверен"] }
  - { id: cash_envelope, title: "Конверт почтовый с денежными купюрами (из чемодана)", ref: "3-08, п. 10", from_stage: 3, aliases: ["конверт", "налич", "купюр", "деньг чемодан", "деньг конверт"] }
  - { id: book2, title: "Книга М. Ю. Лермонтова «Герой нашего времени», с закладкой", ref: "3-08, п. 11", from_stage: 3, aliases: ["лермонтов", "герой", "книг чемодан", "книг лермонтов", "книг герой"] }
  - { id: ticket, title: "Проездной документ (железнодорожный билет) на имя погибшего", ref: "3-08, п. 12", from_stage: 3, aliases: ["билет", "проездн"] }

types:
  - id: chem
    title: "Химическое исследование"
    description: "Состав жидкостей, биологических образцов и следовых количеств веществ: газовая и жидкостная хроматография, масс-спектрометрия. Срок — 1 рабочий день."
  - id: content
    title: "Исследование содержимого"
    description: "Что находится внутри ёмкостей, контейнеров, упаковок и устройств: опись, внешний вид, маркировка, масса, при необходимости — состав. Срок — 1 рабочий день."
  - id: prints
    title: "Дактилоскопическое исследование"
    description: "Выявление следов рук на предметах и их пригодность для идентификации; сравнение с образцами, если они представлены. Срок — 1 рабочий день."
  - id: operator
    title: "Запрос данных оператора связи"
    description: "Подготовим и сопроводим запрос к оператору: соединения абонентского номера и данные базовых станций за указанный период. Срок — 1 рабочий день."
  - id: video
    title: "Запрос видеозаписей"
    description: "Выгрузка и покадровый разбор записей систем видеонаблюдения. Чем точнее указаны место, дата и время, тем быстрее ответ: записи у владельцев камер хранятся недолго. Срок — 1 рабочий день."

results:
  # --- этап 1 --- theater_cam.from_stage 1 = 1 → правило не действует; основания без изменений.
  - id: theater-cam
    object: theater_cam
    types: [video]
    stage: 1
    bases: ["1-06"]
    text: "Камера в коридоре гримёрок неисправна с 27.10.2026. Записей за 10.11.2026 нет."

  # water.from_stage 1 = 1 → без изменений.
  - id: water-chem
    object: water
    types: [chem]
    stage: 1
    bases: ["1-09", "1-10"]
    text: "Питьевая вода. Посторонних веществ не обнаружено."

  # --- этап 2 --- inhaler.from_stage 2 = 2 → правило не действует; 1-03, 1-08 (Лёвин: «баллончик»), 2-02 остаются.
  - id: inhaler-chem
    object: inhaler
    types: [chem, content]
    stage: 2
    bases: ["1-03", "1-08", "2-02"]
    doc: "2-01"
    body: "documents/2-01.md"
  - id: inhaler-prints
    object: inhaler
    types: [prints]
    stage: 2
    bases: ["1-03", "1-08", "2-02"]
    text: "На ингаляторе обнаружены следы пальцев рук погибшего. Других пригодных следов нет."

  # --- этап 3 --- blood.from_stage 3 = 3 → без изменений (подсказка s3.q1 называет 3-01 и 2-02).
  - id: blood-chem
    object: blood
    types: [chem]
    stage: 3
    bases: ["3-01", "2-02", "1-04"]
    doc: "3-05"
    body: "documents/3-05.md"

  # pillbox.from_stage 1 < 3 → только документы этапа 3. Почему эти:
  #   3-01 — Резникова видела, как в 20:25 он достал таблетницу и запил таблетку: главный повод исследовать её;
  #   3-04 — Кирилл: «Седарин» на ночь и днём, «если совсем прижмёт» — что именно он пил и откуда;
  #   3-05 — в крови найдено вещество, которого нет среди его лекарств (2-02, 3-04) → откуда? → таблетница.
  # Убраны 2-02, 1-09, 1-10 (этапы 1–2). Предупреждение для подсказок — см. отчёт: s3.q3 подсказка 1 должна
  # называть основание (3-01), иначе игроки с привычным 2-02 получат «ничего не выявила».
  - id: pillbox-content
    object: pillbox
    types: [content, chem]
    stage: 3
    bases: ["3-01", "3-04", "3-05"]
    doc: "3-06"
    body: "documents/3-06.md"
  - id: pillbox-prints
    object: pillbox
    types: [prints]
    stage: 3
    bases: ["3-01", "3-04", "3-05"]
    text: "На таблетнице обнаружены следы пальцев рук погибшего. Других пригодных следов нет."

  # --- этап 4 --- phone.from_stage 4 = 4 → 1-09 (телефона нет) и 3-03 (номер, взлом) остаются.
  - id: phone-operator
    object: phone
    types: [operator]
    stage: 4
    bases: ["1-09", "3-03"]
    doc: "4-10"
    body: "documents/4-10.md"

  # station_cam.from_stage 4 = 4 → 3-07 остаётся.
  - id: station-video
    object: station_cam
    types: [video]
    stage: 4
    bases: ["3-07"]
    params_answer:
      date: { canon: "30.10.2026" }
      time: { canon: "14:37", tolerance_min: 7 }
      window: { canon: "2" }
    doc: "4-08"
    body: "documents/4-08.md"

  # --- атмосферные записи для ранних и повторных запросов (режиссёр, 21.10.2026; REDESIGN §2.1.4) ---
  # Таблетница доступна с этапа 1 (опись 1-09, поз. 17.3). Чтобы ранний запрос не читался как «таблетки чистые»,
  # по основаниям этапов 1–2 — нейтральный ответ «исследование не проводилось». Заключение — только по документам этапа 3.
  - id: pillbox-early-1
    object: pillbox
    types: [content, chem, prints]
    stage: 1
    bases: ["1-09", "1-10"]
    text: "Таблетница описана при осмотре гримёрной. Исследование личных лекарств погибшего без сведений о том, что он принимал их в день смерти, не проводится."
  - id: pillbox-early-2
    object: pillbox
    types: [content, chem, prints]
    stage: 2
    bases: ["2-02"]
    text: "Сведений о том, что погибший принимал лекарство из таблетницы в день смерти, в направлении нет. Исследование не проводилось."
  # Наружная камера: кадры уже в 2-03; повторный запрос — без штрафа и без новой информации.
  - id: outer-cam
    object: outer_cam
    types: [video]
    stage: 2
    bases: ["2-03", "2-04"]
    text: "Запись наружной камеры за 10.11.2026 уже изъята и приобщена к материалам проверки: кадры с 19:30 до 20:00 — в фототаблице 2-03."
