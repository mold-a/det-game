  # pillbox.from_stage 1 < 3 → только документы этапа 3. Почему эти:
  #   3-01 — Резникова видела, как в 20:25 он что-то достал из «чёрной длинной коробочки с крышечками» и запил водой (25.10:
  #          слово «таблетница» не звучит, игроки узнают её по описи 1-09 и 2-02): главный повод исследовать её;
  #   3-04 — Кирилл: «Седарин» на ночь и днём, «если совсем прижмёт» — что именно он пил и откуда;
  #   3-05 — в крови найдено вещество, которого нет среди его лекарств (2-02, 3-04) → откуда? → таблетница.
  # Убраны 2-02, 1-09, 1-10 (этапы 1–2). Предупреждение для подсказок — см. отчёт: s3.q3 подсказка 1 должна
  # называть основание (3-01), иначе игроки с привычным 2-02 получат «ничего не выявила».
  - id: pillbox-content
    object: pillbox
    types: [content, chem]
    stage: 3
    bases: ["3-01", "3-04", "3-05"]
    doc: "3-06"
    body: "documents/3-06.md"
  # 26.10 (решение автора, финальный заход): дактилоскопия таблетницы — улика f1. На этапе 3 (основания этапа 3, в том числе
  # 3-06) — только факт: на крышке ПТ чужой след, сравнивать не с чем указано. Сравнение — результат этапа 4 (4-16).
  # Почему ПТ, а не СБ: в 19:36 дублёр был в перчатках от костюма (R-01), в 21:08 голыми руками положил «Седарин» в ПТ; СБ
  # он забыл и не трогал (3-06, R-01). S-130: ткань на ЧТ, ПТ и СБ, как в 4-16.
  - id: pillbox-prints
    object: pillbox
    types: [prints]
    stage: 3
    bases: ["3-01", "3-04", "3-05", "3-06"]
    text: "На корпусе таблетницы и на крышках отделений обнаружены следы пальцев рук погибшего (сравнение с дактилоскопической картой, полученной при вскрытии). На крышке отделения «ПТ» — след пальца руки, пригодный для идентификации; погибшему не принадлежит. На крышках «ЧТ», «ПТ» и «СБ» — следы, похожие на отпечатки ткани, для идентификации непригодны. Сравнение с образцами отпечатков других лиц не проводилось: из приложенного документа не видно, кто ещё мог касаться таблетницы. Приложите такой документ."

  # --- этап 4 --- дактилоскопия таблетницы со сравнением (26.10, решение автора; финал — только вывод f1; в вопросах заказ не
  # называется; с 30.10, S-151, к заявке ведёт намёк в письме этапа 4, обязательный s4.q1 снят).
  # pillbox.from_stage 1 < 4 → по правилу 2.1.4 основания — только документы этапа 4. Поручение просило «3-06 + документ с образцами
  # отпечатков (2-xx)», но это документы этапов 3 и 2: такой запрос получит текст этапа 3 (3-06) или отказ (prints-early-2, prints-samples ниже).
  # Основания — то, что указывает на лицо, которое могло касаться таблетницы: 4-09 (Гнедич: 21:08, от гримёрки № 4),
  # 4-07 (видео-алиби снято 12.11 в 14:12, днём, S-155; там же образцы дублёра), 4-08 (вокзал, слежка 01.11).
  # S-128 (26.10, режиссёр): плюс 4-04 (пропранолол куплен худруком), 4-01 (облако: журнал входов, 19:40 «Альтаир»; онлайн-документ
  # есть в списке оснований лаборатории, packs.documents), 4-06 (чат: кто где должен был быть). Результат 4-16 от основания не
  # зависит (сравниваются все восемь карт), поэтому расширение ничего не выдаёт.
  # Образцы (S-136) — служебные отметки 14.11 в 3-01, 3-02, 3-04, 3-10, 3-11, 4-07, 4-09, 4-14.
  - id: pillbox-prints-compare
    object: pillbox
    types: [prints]
    stage: 4
    bases: ["4-09", "4-07", "4-04", "4-01", "4-06", "4-08"]
    doc: "4-16"
