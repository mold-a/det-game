# Лаборатория — Центр судебных экспертиз «Призма» (REDESIGN-2026-10 §2–3).
# Заявка = предмет (свободный текст → распознавание по aliases и title) + вид + основание (+ параметры).
# Предмет не распознан среди доступных → «нельзя передать в лабораторию» (без штрафа).
# Распознан, но записи нет → «Экспертиза ничего не выявила», штраф penalties.lab_no_basis.
# Результаты без `doc` — «атмосферные»: короткий текст, документ не добавляется.
# Правило 2.1.4: если object.from_stage < stage результата, все bases — документы этапа результата.
# Объекты и алиасы — сценарист 21.10.2026 (docs/drafts/lab/expertise-objects.yaml).

objects:
  # ================= нужные объекты (есть результаты) =================

  # Ингалятор в описи 1-09 нет (SCENARIO 1-09: [ЗАПРЕЩЕНО]); он появляется в карте СМП 1-03 («передан полиции»).
  # Оставлен from_stage: 2, как в SCENARIO («экспертиза ингалятора открывается на этапе 2»). Вводная этапа 2 об этом
  # говорит о нём одной фразой; 2-01 — тупик (с 28.10 его требовал контрольный s2.q3.inhaler, снят 30.10, S-151). Иначе (from_stage 1) по правилу 2.1.4 его основаниями мог бы быть
  # только 2-02, а самые естественные основания 1-03 и 1-08 пришлось бы убрать. На этапе 1 «ингалятор» →
  # «нельзя передать» (без штрафа).
  - id: inhaler
    title: "Ингалятор погибшего (найден в кулисе)"
    ref: "1-03"
    from_stage: 2
    aliases: ["ингалят", "баллон", "аэрозол", "спрей"]

  # REDESIGN §2.2: в описи 1-09, поз. 17.3 → from_stage 1; основания результатов — только документы этапа 3.
  # «таблет» ловит и «таблетница», и «таблетки»: отдельной позиции «таблетки» в описях нет, а игроки так назовут
  # именно таблетницу (таблетки лежат в ней). Других предметов с таблетками в описях нет (упаковка на фото 2-06
  # в опись не входит), поэтому «таблетки» → таблетница однозначно. «коробочк» — так её называет 3-01.
  # 25.10 (правка автора): 3-01 больше не называет таблетницу — «чёрная, длинная коробочка с крышечками». Отсюда
  # «коробочк крышечк», «крышечк» и сочетания с «коробк»: «коробка» одна поймала бы конфеты (candies, «коробк») — штраф.
  # «черна/черну/черно коробк» вместо «черн коробк»: основа «черн» (4 символа) есть у fan_black → предупреждение сборки.
  - id: pillbox
    title: "Таблетница недельная, чёрная, пластиковая"
    ref: "1-09, поз. 17.3"
    from_stage: 1
    aliases: ["таблет", "лекарств", "пилюл", "недельн", "коробочк", "коробочк крышечк", "крышечк", "коробк крышечк", "коробк таблет", "черна коробк", "черну коробк", "черно коробк", "длинн коробк", "органайз"]

  # Кровь не входит ни в одну опись: образцы отобраны при вскрытии и хранятся в бюро СМЭ (1-04). «Передать» их
  # можно с этапа 3: на это указывают вопрос s3.q1 («обнаруженных в крови») и 1-04 («могут быть направлены на
  # исследование»); фраза вводной этапа 3 про образцы убрана 23.10 по замечанию автора. from_stage 3 = этап результата,
  # поэтому основания 1-04 и 2-02 остаются законными; подсказка s3.q1 («основание 3-01 или 2-02») не ломается.
  # title не менять: на него ссылается подсказка s3.q1.
  - id: blood
    title: "Образцы крови погибшего"
    ref: "1-04"
    from_stage: 3
    aliases: ["кров", "образц", "биоматер"]

  - id: water
    title: "Бутылка питьевой воды пластиковая, 0,5 л"
    ref: "1-09, поз. 11"
    from_stage: 1
    aliases: ["бутыл", "вода", "воды", "воду", "водой", "питьев"]   # не «вод»: поймает «водитель»

  # Прежний «Сценический костюм погибшего» (ловушка без результатов) привязан к описи: костюм 1-го действия.
  # Костюм 2-го действия был на теле — в описях его нет.
  - id: costume
    title: "Костюм сценический для 1-го действия: фрак, жилет, сорочка"
    ref: "1-09, поз. 4"
    from_stage: 1
    aliases: ["костюм", "фрак", "жилет", "сорочк"]

  # Телефона в описи 1-09 нет — это улика (зарядка висит пустая). from_stage 4 (REDESIGN §2.2): до этапа 4
  # «телефон» → «нельзя передать». ref — где игрок видит номер.
  - id: phone
    title: "Телефон погибшего"
    ref: "3-03, абонентский номер"
    from_stage: 4
    aliases: ["телефон", "мобильн", "смартфон", "сотов", "абонент", "номер"]

  # Камера в коридоре — на плане 1-06 («неисправна»), этап 1.
  - id: theater_cam
    title: "Камера в коридоре гримёрок"
    ref: "1-06"
    from_stage: 1
    aliases: ["камер коридор", "камер гример", "камер театр", "видеокамер коридор", "видеокамер гример", "видеонаблюд коридор", "видеонаблюд гример", "видеонаблюд театр", "коридор гример"]

  # Архивная камера (решение автора 25.10): балкон, снимает только сцену; фрагмент уже в деле (1-15, страница archive).
  # Пустышка, как outer_cam: без неё «архивная камера театра» распознавалась бы как камера коридора («камер театр»),
  # и запрос с основанием 1-15 давал бы штраф «ничего не выявила». Новых сведений результат не даёт.
  - id: archive_cam
    title: "Архивная видеозапись спектакля (камера на балконе)"
    ref: "1-15"
    from_stage: 1
    # S-119 (25.10): голое «архив» убрано — ловило «архив погибшего» (облако) и «архив входящих вызовов» (1-05); только сочетания.
    aliases: ["архивн камер", "архивн запис", "архивн видео", "архив спектакл", "архив театр", "архив сцен", "камер сцен", "камер балкон", "камер сцен театр", "запис спектакл", "видеозапис спектакл", "съемк спектакл"]

  # Вокзал — из билета 3-07 (этап 3), но запрос и результат — этап 4 (SCENARIO). from_stage = этап результата,
  # основание 3-07 законно. Голое «камер» у theater_cam убрано (S-67): до этапа 4 «камеры вокзала» → «нельзя передать».
  - id: station_cam
    title: "Камеры железнодорожного вокзала"
    ref: "3-07"
    from_stage: 4
    aliases: ["вокзал", "камер вокзал", "касс"]
    params:
      - { id: date, type: date, label: "Дата" }
      - { id: time, type: time, label: "Время" }
      - { id: window, type: number, label: "Номер кассы" }

