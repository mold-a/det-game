# Документ 3-03 «Снимки экрана с телефона Кирилла» — печать (python -m engine chatshot → print/chats/).
# Версия техсценария (решение автора 14.10.2026), см. docs/STORY-CHANGES.md и docs/PAPER-REQUIREMENTS.md:
#   - 6.11: Кирилл предупреждает Воронцова, что тот вводил пароль при людях; Воронцов отвечает «Сменил, параноик»;
#   - 12.11, 19:40: три неудачные попытки входа в облако с устройства w.devices.volkov_phone через сеть w.theater.staff_wifi
#     (отсюда «кто-то из театра»); восстановление по SMS отклонено (Кирилл отключил его 22.10 как доверенный контакт);
#   - модель устройства w.devices.volkov_phone в материалах — в 2-17 (служебная отметка в опросе Волкова 13.11, SCENARIO 1-08; до 24.10 — 1-08), 3-03,
#     4-01 (журнал входов) и 4-07 (свойства видео). Сопоставить 2-17 и 3-03 можно уже на этапе 3 — так задумано по SCENARIO (S-48);
#     в 3-03 и 3-04 Волков не называется, подтверждение связи — на этапе 4 (4-07, 4-01). Модель из 2-17 НЕ убирать: опора f1;
#   - 19:41: уведомление Кириллу; звонки Воронцову в 19:42 и 19:55 без ответа, сообщение 19:43 — прочитано в 20:11 (SCENARIO, 3-03);
#   - номер погибшего в звонках оканчивается на w.devices.victim_number_tail (сверка с 4-10).
# Экраны: kind notification | chat | calls. Все строки — шаблоны (c, w). Время — как на экране телефона.
id: "3-03"
screens:
  - kind: chat
    owner: kirill
    with: voroncov
    date: "6 ноября"
    messages:
      # Манера (скрины автора 20.10, docs/VOICES.md): Кирилл — с заглавной, мысль на несколько сообщений, «....», 😢 😂;
      # Воронцов — со строчной, одна «)», 😁, без точки в конце.
      - { from: kirill, time: "22:46", text: "Слушай....", status: read }
      - { from: kirill, time: "22:47", text: "Ты вводил пароль при людях на репетиции, смени.", status: read }
      - { from: voroncov, time: "23:58", text: "сменил, параноик)" }
      - { from: voroncov, time: "23:58", text: "😁" }
      - { from: kirill, time: "23:59", text: "Есть такое)", status: read }
  - kind: notification
    time: "19:41"
    date: "{{ w.dates.premiere_weekday }}, 12 ноября"
    items:
      - app: "{{ w.brands.cloud }}"
        title: "Три неудачные попытки входа"
        text: "Вход с нового устройства: {{ w.devices.volkov_phone }}, браузер, сеть {{ w.theater.staff_wifi }}. Неверный пароль ×3: введён прежний пароль, изменён 6 ноября."
        time: "19:40"
      - app: "{{ w.brands.cloud }}"
        title: "Восстановление по SMS отклонено"
        text: "Запрос восстановления по SMS на номер ***{{ w.devices.victim_number_tail }} отклонён: восстановление отключено. Вы получили это уведомление как доверенный контакт."
        time: "19:40"
  - kind: calls
    owner: kirill
    time: "19:56"
    items:
      - who: voroncov
        number: "{{ w.devices.victim_number }}"
        time: "19:42"
        direction: out
      - who: voroncov
        number: "{{ w.devices.victim_number }}"
        time: "19:55"
        direction: out
  - kind: chat
    owner: kirill
    with: voroncov
    date: "12 ноября"
    messages:
      - { from: kirill, time: "19:43", text: "{{ c.voroncov.familiar }}, кто-то из театра лезет в облако. Позвони!", status: read }
      - { from: kirill, time: "19:44", text: "Срочно!!!!", status: read }
      - { from: kirill, time: "19:56", text: "Набери как прочитаешь....", status: read }
