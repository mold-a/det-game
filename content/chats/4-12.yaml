# Документ 4-12 «Переписка Вольской с Воронцовым» — печать (python -m engine chatshot).
# SCENARIO 4-12 (S-45): 20.10.2026 Вольская уже знает, что табакерка — копия (письмо эксперта 4-11 от 15.10 лежит в том же конверте),
# поэтому она не спрашивает «подлинная ли?», а требует разговора. Воронцов с ней на «вы» (STORY-BIBLE §7, 3-11) и откладывает
# разговор. Запрещено (SCENARIO): намёк на его отъезд. Вместе с реестром облака (4-01, «Внесено» 16.11.2024) — ответ на s4.fb2.
# Черновик разработчика 20.10: время и вторая реплика Вольской; Воронцов — со скобкой (манера из таблицы персонажей),
# без «😁»: разговор неприятный. Манеру Вольской уточнить по скриншотам автора.
id: "4-12"
screens:
  - kind: chat
    owner: volskaya
    with: voroncov
    date: "20 октября"
    messages:
      - { from: volskaya, time: "11:02", text: "{{ c.voroncov.io() }}, нам нужно поговорить о табакерке. Срочно.", status: read }
      - { from: volskaya, time: "11:04", text: "Я жду вашего звонка. Не заставляйте меня искать вас в театре.", status: read }
      - { from: voroncov, time: "19:46", text: "{{ c.volskaya.io() }}, добрый вечер)" }
      - { from: voroncov, time: "19:46", text: "поговорим после премьеры" }
