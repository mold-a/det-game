# Документ 4-06 «Снимок экрана рабочего чата театра» — печать (python -m engine chatshot).
# Содержание чата — TODO(content): участники, название, сообщения. Участник без ID персонажа — поле name.
# SCENARIO 4-06: 07.11 Завьялов — «Артём, на премьере будь на 3-м этаже в зале, на всякий случай».
