# Параметры игры. Все числа здесь — код их не дублирует.
game_id: zakulisami
title: "За кулисами правды"
domain: "https://example.ru"   # TODO(content): свой домен — нужен для QR-кодов
default_year: 2026

crypto:
  iter_answer: 150000    # PBKDF2 для проверки ответа; замерить на телефоне в P08
  iter_stage: 300000     # PBKDF2 для ключей этапов и облака
  entries_pad: 8         # минимальное число записей на единицу (настоящие + случайные)

points:
  bonus: 15
  final: 30

penalties:
  wrong_attempt: -5
  lab_no_basis: -5

hints:
  cost: [10, 20, 40]     # уровни 1, 2, 3
  auto_after_wrong: 3    # после стольких ошибок уровень 1 открывается бесплатно

# Пороги рангов пересмотреть после тестовой игры: максимум 225 (5 бонусов × 15 + 5 финальных × 30),
# обязательные вопросы баллов не дают, поэтому «Шерлок» допускает не больше 44 баллов штрафов за игру.
ranks:
  - { min: null, max: 99, name: "Стажёр" }
  - { min: 100, max: 180, name: "Следователь" }
  - { min: 181, max: null, name: "Шерлок" }

# Строки, которых не должно быть в dist/ в открытом виде (дополнительно к ответам)
leak_watchlist:
  - "пропранолол"
  - "анаприлин"
  - "седарин"
  - "VID_20261108"
  - "знал, что копия"
  - "Сценическая мастерская"
