# Параметры игры. Все числа здесь — код их не дублирует.
game_id: zakulisami
title: "За кулисами правды"
domain: "https://mydetgame.ru"   # куплен автором 20.10.2026 (REG.RU); QR зависят только от домена, не от хостинга
default_year: 2026

crypto:
  iter_answer: 150000    # PBKDF2 для проверки ответа; замерить на телефоне в P08
  iter_stage: 300000     # PBKDF2 для ключей этапов и облака
  entries_pad: 8         # минимальное число записей на единицу (настоящие + случайные)

points:
  bonus: 15
  final: 30

penalties:
  wrong_attempt: -5
  lab_no_basis: -5

hints:
  cost: [10, 20, 40]     # уровни 1, 2, 3
  auto_after_wrong: 3    # после стольких ошибок уровень 1 открывается бесплатно

# Пороги рангов пересмотреть после тестовой игры: максимум 285 (9 бонусов × 15 + 5 финальных × 30;
# бонусы s2.b2 и fb3 добавлены 21.10 по решению автора, было 255). Обязательные вопросы баллов не дают,
# поэтому «Шерлок» допускает не больше 60 баллов штрафов и пропусков за игру.
ranks:
  - { min: null, max: 119, name: "Стажёр" }
  - { min: 120, max: 224, name: "Следователь" }
  - { min: 225, max: null, name: "Шерлок" }

# Печать бумаги конвертов (python -m engine paper, docs/05 §4).
print:
  duplex: true                       # двусторонняя A4: каждый документ и каждый протокол опроса — с нечётной страницы
  blank_back: "Оборот не заполнен"   # пометка на пустом обороте ("" — оборот совсем пустой)
  fit:
    last_page_min: 0.2               # на последней странице меньше 20 % полосы (пара строк и подписи) — документ ужимается
    scales: [0.97, 0.94, 0.91, 0.88] # ступени масштаба; 0.88 ≈ кегль 9,7 pt — ниже не ужимаем

# Строки, которых не должно быть в dist/ в открытом виде (дополнительно к ответам)
leak_watchlist:
  - "пропранолол"
  - "анаприлин"
  - "седарин"
  - "VID_20261108"
  - "знал, что копия"
  - "Сценическая мастерская"

# Законные повторы: фразы, которые стоят и в открытом тексте (открытая страница, текст этапа 1, сайт лаборатории),
# и в закрытом (пакеты 2–4, экспертизы, бумага). Шинглы этих фраз leak scan не считает иголками (docs/02 §Leak scan).
# Сюда — только служебные обороты, названия организаций и подписи; факты и улики — никогда.
# Шаблоны {{ }} разворачиваются как в остальном контенте.
leak_public_ok:
  - "Бюро судебно-медицинской экспертизы"            # название учреждения: сайт лаборатории («О центре») и бланки СМЭ
  - "в дни спектаклей с 18:00 до конца спектакля"    # график администратора зала (театр) и период запроса к оператору (4-10)
  - "Майор юстиции {{ c.belyaev.short() }}"          # подпись писем следователя
  - "сержанта полиции {{ c.kovalev.short() }}"       # подпись/должность сотрудника полиции в тексте этапа 1 и в заключениях
  - "{{ c.gromov.short('gen') }} в"                  # «страницы Громовой Ю. С. в соцсети»: открытый текст этапа 1 и справка 2-10
  - "укажите основание — документ, из которого видно, зачем нужна экспертиза"  # правило заявок лаборатории (повторено в подсказках)
  - "Ответ принят. Вскройте конверт"                  # типовая формула перехода между этапами (pack-1 и письма этапов 2–4)
  # Бумага конвертов 2–4 открытыми страницами не отбеливается (docs/02): её совпадения с открытыми страницами — только здесь.
  - "заместитель главы администрации города по социальной политике"  # должность Громовой: страницы «Круга», пресс-справка 2-10
  - "{{ w.theater.full }}"                           # название театра: страницы театра, новостей, бумага 2-03
  - "{{ w.city }}, {{ w.theater.address }}"          # адрес театра: страница фонда и театра, договор 4-02
  - "со двора, въезд — {{ w.theater.service_street }}"  # служебный вход: страница театра и акт 2-03
  - "{{ w.theater.address }}, 2-й этаж, административный коридор"  # адрес фонда: страница фонда, 2-06
  - "Благотворительный фонд поддержки театрального искусства"  # название фонда: страница фонда, договор 4-02
  - "«{{ w.play.title }}». {{ w.play.author }}"      # афиша: страница театра, договор 4-02
  - "10 ноября 2026 года"                            # дата премьеры: афиша театра, справка 2-10
  - "В дни спектаклей — до начала второго действия"  # режим кассы: страница театра, показания 3-01
  - "Девиз цеха: «У меня всё записано»"              # девиз на странице театра, повторён в показаниях 3-01
