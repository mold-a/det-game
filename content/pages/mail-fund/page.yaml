# Почтовый ящик фонда «Сцена» (тип mail; решение автора 25.10 — п. 7 «отмыв денег»). Этап 4, закрытая, QR на листе 4-15.
# Источник — черновик docs/drafts/pages/mail-fund.md с правками аудита S-122 (25.10):
#   - в письме директора ООО только «Остаток — Виталию» (без «по вашему актёру… претензий не имеет» и без «как обычно»):
#     связку «переплата → долг дублёра» игроки собирают сами: 4-02 (1,8 млн при 0,6 млн) + 4-03 (В. П. Родионов — совладелец)
#     + 4-06 («опять спрашивал Родионов… по декорациям») + krug-volkov (кредитор в друзьях);
#   - письмо администрации нейтральное (управление культуры, срок отчёта), без заместителя главы, без Громовой, без «дам лично»:
#     бонус s3.b3 открыт до финала и не должен стать тривиальным;
#   - дар музею: «акт — к Новому году» (сезон открылся 18.09).
# След на этапе 3 — 3-01 (Резникова: ширма из нового комплекта развалилась, «заказывал фонд, не театр»); на этапе 2 — 2-05 (19:45 ширма),
# 2-06 (папка «отчёт для администрации»), 2-15 («бюджет декораций»).
# Даты: смета 02.10 → договор 14.10 (4-02) → оплата 05.11, п/п № 296 (4-02) → тот же день «мы в расчёте» (R-01) и записка о камере (4-05).
# СТРОГО: ни «откат», «отмыв», «долг», «наличные»; ни Волкова по имени, ни таблеток (кроме напоминания поликлиники), ни телефона погибшего,
# ни Громовой, ни 12.11. Leak scan: тексты — секрет этапа 4; не повторять фраз открытых страниц (fund «Отчётность», gromov 29.10).
# Адреса — только вымышленная зона .vr (как prizma-ekspert.vr в lab.yaml); домен сервиса — w.brands.mail_domain (в адресе шаблон нельзя: валидатор).
slug: mail-fund
type: mail
doc: "4-15"                     # этап 4 — по документу
locked: true
qr_label: "Выгрузка почтового ящика"
brand: "{{ w.brands.mail }}"
notice: "Выгрузка почтового ящика по запросу следственного отдела от 14.11.2026 (сведения — лист 4-15). Период: с 01.09.2026 по 14.11.2026. Письма приведены без изменений, вложения — перечнем."
account:
  name: "Фонд «{{ w.money.fund }}»"
  address: "fond.scena@soroka.vr"
folders: ["Входящие", "Отправленные", "Договоры", "Удалённые", "Черновики"]
threads:

  # --- Личное: дар музею (сентябрь). Тихий фон к fb2: Завьялов отговаривает от экспертизы; Вольская всё равно заказала её 28.09
  # «для оформления дара музею театра» (4-11).
  - id: gift
    folder: "Входящие"
    subject: "Дар музею театра"
    messages:
      - from: { person: volskaya, address: "teatr.lyubitel@soroka.vr" }
        to: [{ name: "Фонд «{{ w.money.fund }}»", address: "fond.scena@soroka.vr" }]
        date: "2026-09-25T11:14"
        body: |
          {{ c.zavyalov.io() }}, добрый день)

          Хочу в этом сезоне передать в музей театра табакерку. Ту самую, вы помните.

          Что для этого нужно? Экспертиза нужна???
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ person: volskaya, address: "teatr.lyubitel@soroka.vr" }]
        date: "2026-09-26T09:02"
        body: |
          {{ c.volskaya.io() }}. Добрый день.

          Музей примет дар по описи и акту дарения. Экспертиза не обязательна. Не тратьтесь.

          Акт подготовим к Новому году.

          {{ c.zavyalov.short() }}

  # --- Схема, часть 1: смета (октябрь). Совпадает с 4-02: смета на 1 800 000, договор 14.10.
  - id: estimate
    folder: "Договоры"
    subject: "«{{ w.play.title }}», смета на декорации"
    messages:
      - from: { person: rodionov_director, address: "director@sc-masterskaya.vr" }
        to: [{ name: "Фонд «{{ w.money.fund }}»", address: "fond.scena@soroka.vr" }]
        date: "2026-10-02T16:47"
        body: |
          {{ c.zavyalov.io() }}, добрый день!

          Направляю смету на декорации к спектаклю «{{ w.play.title }}», как обсуждали. Итог — 1 800 000. Договор подготовим к 14-му.

          С уважением,
          {{ c.rodionov_director.short() }}, ООО «{{ w.money.llc }}»
        attachments:
          - { name: "Смета_Маскарад.xlsx", size: "24 КБ" }
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ person: rodionov_director, address: "director@sc-masterskaya.vr" }]
        date: "2026-10-02T17:15"
        body: |
          {{ c.rodionov_director.io() }}. Получил. Договор — к 14-му.

          {{ c.zavyalov.short() }}

  # --- Схема, часть 1б: завпост против (октябрь). Совпадает с 4-02, справка: «Мне ответили, что фонд — не театр…»
  - id: estimate-fwd
    folder: "Отправленные"
    subject: "Fwd: «{{ w.play.title }}», смета на декорации"
    messages:
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ person: prod_manager, address: "postanovka@vodt.vr" }]
        date: "2026-10-05T09:30"
        body: |
          {{ c.prod_manager.io() }}. Смета во вложении. Посмотрите по срокам монтажа.

          {{ c.zavyalov.short() }}
        attachments:
          - { name: "Смета_Маскарад.xlsx", size: "24 КБ" }
      - from: { person: prod_manager, address: "postanovka@vodt.vr" }
        to: [{ person: zavyalov, address: "fond.scena@soroka.vr" }]
        date: "2026-10-06T10:12"
        body: |
          {{ c.zavyalov.io() }}, по срокам успеют: монтаж до 8 ноября, к техническим прогонам.

          Но я {{ c.prod_manager.g('посмотрел', 'посмотрела') }} и цены. Портал, станок, колонны, задник, мебель — у нас в цехах это тысяч шестьсот, не больше. Задник они просят наш старый, от «Бесприданницы», — перепишут. Колонны по эскизу — фанера и пенопласт под мрамор.

          Предлагаю запросить ещё два предложения. Время до премьеры есть.

          {{ c.prod_manager.short() }}
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ person: prod_manager, address: "postanovka@vodt.vr" }]
        date: "2026-10-06T18:55"
        body: |
          {{ c.prod_manager.io() }}. Спасибо.

          Декорации оплачивает фонд, а не театр. Считать деньги фонда — не ваша забота. Вопрос закрыт.

          {{ c.zavyalov.short() }}

  # --- Рабочее: аренда. «Малое фойе после спектаклей не сдаётся» — тихий след «Закрытых вечеров» (малое фойе, после спектаклей).
  # 18.12.2026 — пятница.
  - id: foyer
    folder: "Входящие"
    subject: "Аренда малого фойе, 18 декабря"
    messages:
      - from: { name: "Родительский комитет 11 «А», гимназия № 5", address: "rk11a.gim5@soroka.vr" }
        to: [{ name: "Фонд «{{ w.money.fund }}»", address: "fond.scena@soroka.vr" }]
        date: "2026-10-16T21:37"
        body: |
          Здравствуйте!

          Хотим провести для выпускников новогодний вечер в малом фойе театра в пятницу, 18 декабря, с 21:30 до 23:30, после спектакля. Человек 40, фуршет свой. Сколько это будет стоить?

          Заранее спасибо!
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ name: "Родительский комитет 11 «А», гимназия № 5", address: "rk11a.gim5@soroka.vr" }]
        date: "2026-10-19T09:20"
        body: |
          Добрый день.

          Малое фойе после спектаклей не сдаётся. Можем предложить репетиционный зал на третьем этаже в дневное время, по будням.

          {{ c.zavyalov.short() }}

  # --- Администрация (S-122): нейтральное напоминание о сроке отчёта. Ни заместителя главы, ни Громовой, ни «пояснений лично».
  # Срок 28.10, отчёт ушёл 27.10 — до совещания 29.10 на странице gromov («к отдельным отчётам есть вопросы»; фонд там не назван)
  # и до строки fund «передан в октябре». Фраз этих страниц не повторять (leak scan).
  - id: report
    folder: "Входящие"
    subject: "Отчёт НКО за прошлый год: срок — 28 октября"
    messages:
      - from: { name: "Управление культуры администрации города", address: "kultura@adm-vrch.vr" }
        to: [{ name: "Фонд «{{ w.money.fund }}»", address: "fond.scena@soroka.vr" }]
        date: "2026-10-21T15:12"
        body: |
          Добрый день.

          Управление культуры просит до 28.10.2026 представить отчёт о деятельности фонда за прошлый год по прилагаемой форме: электронную копию — ответом на это письмо, оригинал с подписью и печатью — в управление, кабинет 305.

          Главный специалист управления культуры
          {{ c.admin_culture.short() }}
        attachments:
          - { name: "Форма_отчёта_НКО.docx", size: "38 КБ" }
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ name: "Управление культуры администрации города", address: "kultura@adm-vrch.vr" }]
        date: "2026-10-27T17:48"
        body: |
          {{ c.admin_culture.io() }}. Добрый день.

          Отчёт направляю. Оригинал завезут завтра.

          Председатель правления фонда «{{ w.money.fund }}»
          {{ c.zavyalov.short() }}
        attachments:
          - { name: "Отчёт_фонда_2025.pdf", size: "1,4 МБ" }

  # --- Схема, часть 2а: оплата (ноябрь). П/п № 296 от 05.11 — как штамп «ОПЛАЧЕНО» в 4-02. В тот же день записка 4-05:
  # ремонт камеры за 2 350 ₽ «отложить ввиду отсутствия средств».
  # 26.10 (решение автора): бухгалтер — inna (главный бухгалтер театра и фонда, мать дублёра; было — Савина, fund_accountant).
  # Её подпись — и в штампе оплаты 4-02. Мотив исполнителя (R-01): вечером 05.11 худрук показывает дублёру эту платёжку.
  # В деловой почте она коротко и твёрдо, без «ой» и эмодзи: работу знает.
  - id: payment
    folder: "Входящие"
    subject: "Оплата по договору 14/26"
    messages:
      - from: { person: inna, address: "buh.fond@soroka.vr" }
        to: [{ name: "Фонд «{{ w.money.fund }}»", address: "fond.scena@soroka.vr" }]
        date: "2026-11-05T12:31"
        body: |
          {{ c.zavyalov.io() }}, оплата по договору 14/26 прошла: п/п № 296, 1 800 000,00. {{ c.inna.g('Провёл', 'Провела') }} по вашему распоряжению.

          Акта приёмки у меня нет. Без акта год не закрою.

          Гл. бухгалтер {{ c.inna.short() }}
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ person: inna, address: "buh.fond@soroka.vr" }]
        date: "2026-11-05T13:04"
        body: |
          {{ c.inna.io() }}. Акт будет после монтажа.

          {{ c.zavyalov.short() }}

  # --- Схема, часть 2б: «остаток». «Виталию» — имя кредитора (krug-volkov, 4-03: В. П. Родионов, совладелец ООО). Вывод — за игроками.
  # Пятого же ноября кредитор позвонил дублёру: «мы в расчёте» (R-01).
  - id: remainder
    folder: "Удалённые"
    subject: "Договор 14/26"
    messages:
      - from: { person: rodionov_director, address: "director@sc-masterskaya.vr" }
        to: [{ name: "Фонд «{{ w.money.fund }}»", address: "fond.scena@soroka.vr" }]
        date: "2026-11-05T17:52"
        body: |
          {{ c.zavyalov.io() }}, деньги пришли, спасибо.

          Остаток — {{ c.rodionov_creditor.first('dat') }}.

          Акт привезу после монтажа.
      - from: { person: zavyalov, address: "fond.scena@soroka.vr" }
        to: [{ person: rodionov_director, address: "director@sc-masterskaya.vr" }]
        date: "2026-11-05T18:20"
        body: |
          {{ c.rodionov_director.io() }}. Такие вещи не пишут.

          Позвоните.

  # --- Личное: поликлиника (после смерти, не прочитано). Тихий след к 4-04: кардиолог из рецепта, «Городская поликлиника № 2».
  - id: clinic
    folder: "Входящие"
    subject: "Напоминание о записи к врачу"
    messages:
      - from: { name: "Городская поликлиника № 2", address: "zapis@gp2-vrch.vr" }
        to: [{ name: "Фонд «{{ w.money.fund }}»", address: "fond.scena@soroka.vr" }]
        date: "2026-11-13T06:00"
        read: false
        body: |
          Уважаем{{ c.zavyalov.g('ый', 'ая') }} {{ c.zavyalov.full() }}!

          Напоминаем о записи: 20.11.2026, 10:30, врач-кардиолог {{ c.cardiologist.short() }}, кабинет 12. Если рецепт требует продления, возьмите его с собой.

          Письмо отправлено автоматически, отвечать на него не нужно.
