# Фраза-привычка Кирилла (w.clues.kirill_habit, «Было бы за что» — ответ на «спасибо») звучит в звонке и в опросе 3-04; по ней игроки узнают звонившего (бонус s3.b2). Голос звонящего намеренно изменён (сиплый, приглушённый; решение автора 23.10, вариант «а») — узнают по фразе, не по тембру; в 1-05 это отмечено.
# Расшифровки нет нигде (решение автора 24.10): 1-05 — сопроводительный лист без реплик, привычку узнают только на слух.
# На первом опросе (2-14, 11.11) Кирилл этой фразы НЕ говорит.
#
# ТЕКСТ РЕПЛИК ЗАПИСИ (единственный носитель в content/; в игрока не выводится, в dist/ комментарии не попадают;
# нужен для переозвучки при смене имён). Файл audio/anonymous_call.mp3, 0:40, обе стороны разговора.
# Абонент (голос Кирилла, изменён: сиплый, приглушённый) / Дежурная ({{ c.duty_officer.short() }}, женский голос, обычный).
# Фамилия погибшего в записи — как в characters.yaml на момент озвучки (при смене имён — переозвучить).
#   Дежурная: Дежурная часть, слушаю вас.
#   Абонент:  Это насчёт театра. Насчёт [фамилия погибшего, род. п.].
#   Дежурная: Что именно вы хотите сообщить?
#   Абонент:  [Фамилия погибшего] умер не просто так. Я не шучу. Вы слышите? Не просто так.
#   Дежурная: Представьтесь, пожалуйста. Откуда вам это известно?
#   Абонент:  Не перебивайте, у меня минута. И всё рассказать. Посмотрите, кому это мешало.
#             (фраза «Он собирался уехать» вырезана из готовой записи 24.10, S-81; обрывок «И всё рассказать» оставлен
#              решением автора, который прослушал запись после вырезки, S-92)
#   Дежурная: Что рассказать? Кому? Вы можете подъехать и дать объяснение?
#   Абонент:  (пауза) Записали? Собирался всё рассказать. И не успел.
#   Дежурная: Записала. Спасибо за сигнал. Теперь назовите себя.     (женский род; на слух проверить, что в записи именно «Записала» — S-98)
#   Абонент:  Было бы за что. Всё, больше ничего не скажу.          (w.clues.kirill_habit — ответ на «спасибо», ключ бонуса s3.b2)
#   Дежурная: Подождите. Кто вы?
#   (конец)   Абонент завершил вызов: тишина 0,5 с, обрыв.
# Фоновых звуков нет; телефонный фильтр 300–3400 Гц, моно; громкость Абонента на 4–6 дБ ниже Дежурной.
# Критерий приёмки (бонус s3.b2 решается только на слух): «Было бы за что» разборчиво и узнаваемо по интонации, не по тембру.
note: "Сведения о вызове — в материалах дела (1-05)."
