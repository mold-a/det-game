    title: "Переписка"
    kind: chat
    participants: [voroncov, zavyalov]
    # Черновик разработчика 20.10 (docs/STORY-CHANGES.md): ультиматум 14.09 по STORY-BIBLE §3.2 — выходит из «вечеров»,
    # требует вернуть деньги Вольской и прекратить продажи. S-55: «всё записано… уйдёт само» — блеф, страховки (облака с
    # публикацией по расписанию) ещё нет, она появится 22.10 (письмо «Если вы это читаете»). Слово «копия» здесь
    # не используется (оно только в строке реестра). Манера — docs/VOICES.md: Воронцов со строчной и с переносами строк,
    # Завьялов — коротко, с заглавной, с точками; обращение «Имя.» с точкой.
    messages:
      - { from: voroncov, datetime: "2026-09-14T22:41", text: "я выхожу из вечеров" }
      - { from: voroncov, datetime: "2026-09-14T22:41", text: "совсем. больше ни одного вечера" }
      - { from: voroncov, datetime: "2026-09-14T22:43", text: "и деньги {{ c.volskaya.io('dat') }} надо вернуть\nты знал, что табакерка — фальшивка. я тоже знал\nхватит" }
      - { from: zavyalov, datetime: "2026-09-14T22:58", text: "{{ c.voroncov.first() }}. Это не разговор для переписки. Завтра в театре." }
      - { from: voroncov, datetime: "2026-09-14T23:02", text: "нет\nпродажи прекращаем, деньги возвращаем. всё" }
      - { from: zavyalov, datetime: "2026-09-14T23:10", text: "Это ультиматум?" }
      - { from: voroncov, datetime: "2026-09-14T23:14", text: "считай, что да" }
      - { from: voroncov, datetime: "2026-09-14T23:15", text: "и не пугай меня. всё записано" }
      - { from: voroncov, datetime: "2026-09-14T23:16", text: "если со мной что-то случится —\nвсё уйдёт само" }
      - { from: zavyalov, datetime: "2026-09-14T23:40", text: "Я тебя услышал." }
