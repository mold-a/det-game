# Черновик сценариста (REDESIGN-2026-10 §4.3, схема §6.2). Официальный сайт театра. Этап 1, открытая.
# Ссылки сюда: статья news, посты gromov (08.11, 11.11), профили «Круга», fund, krug (популярное).
# 23.10: карточки помрежа, Гнедич и Виктора ведут на их «Круг»; карточка худрука — по-прежнему на fund.
# Запреты §4.4 соблюдены: ни денег, ни декораций/ООО, ни таблеток/болезней, ни аукционов, ни малого фойе;
# легенда Громовой не трогается (её на сайте нет). Улик нет: только то, что уже есть в 1-07, 1-08, 1-13.
# Времена: только 10:00, 12:00, 13:00, 14:00, 18:00, 19:00, 21:00 — не ответы и не параметры экспертиз.
slug: theater
type: site
stage: 1
locked: false
brand: "{{ w.theater.short }}"
skin: theater
tagline: "{{ w.theater.full }} · сезон 2026/2027"
sections:
  - id: afisha
    title: "Афиша"
    blocks:
      - kind: notice
        text: "10 ноября 2026 года {{ c.voroncov.g('ушёл', 'ушла') }} из жизни {{ c.voroncov.g('народный артист', 'народная артистка') }} {{ c.voroncov.io() }} {{ c.voroncov.last() }}. Театр скорбит вместе со зрителями. Показы спектакля «{{ w.play.title }}» отменены до особого распоряжения, билеты принимаются к возврату в кассе театра в течение месяца. О дне прощания мы сообщим дополнительно."
      - kind: text
        md: "### Ноябрь"
      - kind: table
        columns: ["Дата", "Начало", "Спектакль", "Билеты"]
        rows:
          - ["10.11, вт", "19:00", "«{{ w.play.title }}», {{ w.play.author }}. Премьера", "Спектакль остановлен"]
          - ["13.11, пт", "19:00", "«{{ w.play.title }}»", "Показ отменён"]
          - ["14.11, сб", "18:00", "«{{ w.play.title }}»", "Показ отменён"]
          - ["15.11, вс", "12:00", "«Аленький цветочек», сказка (6+)", "Перенесён на 22.11"]
          - ["20.11, пт", "19:00", "«Ревизор», Н. В. Гоголь", "В продаже"]
          - ["21.11, сб", "18:00", "«Бесприданница», А. Н. Островский", "В продаже"]
          - ["22.11, вс", "12:00", "«Аленький цветочек», сказка (6+)", "В продаже"]
          - ["27.11, пт", "19:00", "«Три сестры», А. П. Чехов", "В продаже"]
          - ["28.11, сб", "18:00", "«Горе от ума», А. С. Грибоедов", "Последние места"]
      - kind: text
        md: "Касса театра работает ежедневно с 10:00 до 19:00, перерыв с 13:00 до 14:00. В дни спектаклей — до начала второго действия. Опоздавшие зрители проходят в зал в антракте: просим отнестись с пониманием, артистам тоже нужно сосредоточиться."

  - id: troupe
    title: "Труппа"
    blocks:
      - kind: text
        md: "В труппе театра — тридцать два артиста. Ниже — исполнители главных ролей премьеры «{{ w.play.title }}» и люди, без которых не открывается ни один занавес. Если у артиста есть страница в «{{ w.brands.social }}», карточка ведёт на неё."
      - kind: cards
        items:
          - title: "{{ c.voroncov.io() }} {{ c.voroncov.last() }}"
            subtitle: "{{ c.voroncov.g('Народный артист', 'Народная артистка') }} · Арбенин («{{ w.play.title }}»)"
            text: "Больше тридцати лет на этой сцене: Городничий в «Ревизоре», Вершинин в «Трёх сёстрах», Паратов в «Бесприданнице». Светлая память."
            photo: "portraits/voroncov.jpg"
            page: krug-voroncov
          - title: "{{ c.stas.io() }} {{ c.stas.last() }}"
            subtitle: "{{ c.stas.g('Артист', 'Артистка') }} · Звездич («{{ w.play.title }}»)"
            text: "Хлестаков в «Ревизоре», Чацкий в «Горе от ума». Уверяет, что «Маскарад» тоже написал Чехов, просто под псевдонимом."
            photo: "portraits/stas.jpg"
            page: krug-levin
          - title: "{{ c.nina_actress.io() }} {{ c.nina_actress.last() }}"
            subtitle: "Артистка · {{ w.play.role_nina }} («{{ w.play.title }}»)"
            text: "Лариса в «Бесприданнице», Маша в «Трёх сёстрах». В труппе с 2019 года."
            photo: "portraits/nina_actress.jpg"   # X05 (docs/PRODUCTION.md §4.1): вымышленное лицо, без образца
          - title: "{{ c.volkov.io() }} {{ c.volkov.last() }}"
            subtitle: "{{ c.volkov.g('Артист', 'Артистка') }} · дублёр роли Арбенина («{{ w.play.title }}»)"
            text: "Молчалин в «Горе от ума», Бобчинский в «Ревизоре». Третий сезон в труппе."
            photo: "portraits/volkov.jpg"
            page: krug-volkov
      - kind: text
        md: "### Художественное руководство и цеха"
      - kind: cards
        items:
          - title: "{{ c.zavyalov.io() }} {{ c.zavyalov.last() }}"
            subtitle: "Художественный руководитель театра"
            text: "Режиссёр-постановщик «{{ w.play.title }}». Председатель правления благотворительного фонда «{{ w.money.fund }}»."
            photo: null
            page: fund
          - title: "{{ c.reznikova.io() }} {{ c.reznikova.last() }}"
            subtitle: "Помощник режиссёра"
            text: "Двенадцатый сезон ведёт спектакли театра. Девиз цеха: «У меня всё записано»."
            photo: "portraits/reznikova.jpg"
            page: krug-reznikova
          - title: "{{ c.gnedich.io() }} {{ c.gnedich.last() }}"
            subtitle: "{{ c.gnedich.g('Заведующий', 'Заведующая') }} костюмерным цехом"
            text: "Сорок костюмов к премьере, каждый — по эскизам и по фигуре. Просит не путать костюмерный цех с проходным двором."
            photo: "portraits/gnedich.jpg"
            page: krug-gnedich
          - title: "{{ c.viktor.io() }} {{ c.viktor.last() }} «{{ c.viktor.nick }}»"
            subtitle: "Художник по свету"
            text: "Двадцать лет за световым пультом. Любимая фраза: «Свет не врёт»."
            photo: "portraits/viktor.jpg"
            page: krug-kuznecov

  - id: news
    title: "Новости"
    blocks:
      - kind: text
        md: |
          **11 ноября 2026**

          С глубоким прискорбием сообщаем, что 10 ноября, во время премьерного спектакля «{{ w.play.title }}», {{ c.voroncov.g('ушёл', 'ушла') }} из жизни {{ c.voroncov.g('народный артист', 'народная артистка') }} {{ c.voroncov.io() }} {{ c.voroncov.last() }}. Коллектив театра выражает искренние соболезнования родным и близким {{ c.voroncov.io('gen') }}. Слова памяти можно оставить на [{{ c.voroncov.g('его', 'её') }} странице в «{{ w.brands.social }}»]({{ link('krug-voroncov') }}), подробности — в [материале портала «{{ w.brands.news }}»]({{ link('news') }}).
      - kind: text
        md: |
          **9 ноября 2026**

          Генеральный прогон «{{ w.play.title }}» прошёл при полном зале: по традиции на него пришли сотрудники театра, их семьи и студенты училища искусств. Занавес закрылся в половине десятого, аплодисменты — на четверть часа позже.
      - kind: text
        md: |
          **22 октября 2026**

          Открыта продажа билетов на премьеру. Билеты на 10 ноября раскуплены за два дня, на следующие показы — в кассе и у администраторов. Просим не покупать билеты с рук: в прошлом сезоне с рук продали даже место в оркестровой яме.
      - kind: text
        md: |
          **18 сентября 2026**

          Театр открыл сезон 2026/2027. Главная премьера сезона — «{{ w.play.title }}» {{ w.play.author }} в постановке {{ c.zavyalov.io('gen') }} {{ c.zavyalov.last('gen') }}, в роли Арбенина — {{ c.voroncov.g('народный артист', 'народная артистка') }} {{ c.voroncov.io() }} {{ c.voroncov.last() }}.

  - id: about
    title: "О театре"
    blocks:
      # F01, F02 (решение автора 23.10 «берём всё»; docs/PRODUCTION.md §4.9). Атмосфера, улик нет.
      # Фасад и зал — без надписей, гербов и вывесок; зал сходится с текстом ниже (партер, бельэтаж с ложами, балкон).
      - kind: photo
        file: "theater/facade.jpg"
        caption: "Здание театра на Театральной площади, 1958 год. Ноябрь"
        wide: true
      - kind: text
        md: |
          {{ w.theater.full }} ведёт летопись с 1902 года, когда купеческое собрание {{ w.city_gen }} отдало свой зал под «постоянную драматическую сцену». Нынешнее здание на Театральной площади построено в 1958 году: зрительный зал на 640 мест, партер, бельэтаж с ложами, балкон и малая сцена для камерных постановок.

          В репертуаре — русская классика, современная драма и спектакли для детей. Театр много гастролирует по области и любит возвращаться: в {{ w.neighbor_city_pre }} нас ждут уже двадцать лет подряд.

          Попечительский совет и благотворительный фонд «{{ w.money.fund }}» помогают театру с гастролями, детской студией и стипендиями молодым артистам.
      - kind: photo
        file: "theater/hall.jpg"
        caption: "Зрительный зал: партер, бельэтаж с ложами у сцены, балкон"
        wide: true
      - kind: text
        md: "**Правила для зрителей.** Вход в зал после третьего звонка — только в антракте. Фото- и видеосъёмка во время спектакля запрещена. Телефоны просим выключить: Арбенину и так непросто."

  - id: partners
    title: "Партнёры"
    blocks:
      - kind: cards
        items:
          - { title: "Благотворительный фонд «{{ w.money.fund }}»", subtitle: "Генеральный партнёр", text: "Гастроли, детская студия, стипендии молодым артистам.", photo: null, page: fund }
          - { title: "«{{ w.brands.news }}»", subtitle: "Информационный партнёр", text: "Городской интернет-портал: новости, афиша, погода.", photo: null, page: news }
          - { title: "Соцсеть «{{ w.brands.social }}»", subtitle: "Мы в соцсетях", text: "Обсуждения спектаклей, фото зрителей, конкурсы.", photo: null, page: krug }
          - { title: "Мебельная фабрика «Ясень и К»", subtitle: "Партнёр сезона", text: "Кресла в партере. Скрипят только на комедиях.", photo: null }
          - { title: "Пекарня «Мучной двор»", subtitle: "Партнёр буфета", text: "Пирожки к антракту — с капустой, с яблоками и с вишней.", photo: null }
      - kind: text
        md: "### Друзья театра"
      - kind: cards
        items:
          - title: "{{ c.volskaya.io() }} {{ c.volskaya.last() }}"
            subtitle: "Меценат, попечитель театра"
            text: "Много лет поддерживает детскую студию и гастроли театра."
            photo: "portraits/volskaya.jpg"
            page: krug-volskaya

  - id: contacts
    title: "Контакты"
    blocks:
      - kind: text
        md: |
          - **Адрес:** {{ w.city }}, {{ w.theater.address }}.
          - **Касса:** ежедневно 10:00–19:00, перерыв 13:00–14:00.
          - **Служебный вход:** со двора, въезд — {{ w.theater.service_street }}. Посторонним вход воспрещён — и это не фигура речи.
          - **Администратор зала:** в дни спектаклей с 18:00 до конца спектакля.
          - **Как добраться:** автобусы № 3 и № 11, остановка «Театральная площадь».

footer: "© {{ w.theater.full }}, 2026. Фото — пресс-служба театра. Сайт работает в тестовом режиме: о неточностях пишите администратору."
