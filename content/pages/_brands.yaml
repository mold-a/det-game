# Короткие тексты подвала вымышленных сервисов: «О сервисе», «Правила», «Помощь» (docs/03 §8).
# Ключ — бренд из world.yaml → brands. Абзацы разделяются пустой строкой. Тон служебный; без сюжета, имён и дат.
# Показываются в подвале страницы сервиса в раскрывающемся блоке «Сведения о сервисе» (без окон).
services:
  social:
    about: |-
      «{{ w.brands.social }}» — городская сеть для общения: страницы горожан, организаций и сообществ, ленты, отметки и комментарии.

      Открытые страницы можно смотреть без входа.
    rules: |-
      На странице разрешены только собственные записи и фотографии. Оскорбления, реклама без отметки и чужие личные данные удаляются.

      Пользователь может ограничить доступ к своей странице: тогда её видят только друзья.
    help: |-
      Чтобы поставить отметку, оставить комментарий, подписаться или написать сообщение, нужно войти в «{{ w.brands.social }}».

      Если страница недоступна, владелец ограничил к ней доступ. Мы не можем открыть её по запросу.
  photo:
    about: |-
      «{{ w.brands.photo }}» — сервис для хранения и показа фотографий. Снимки собираются в ленту профиля и открываются крупно.
    rules: |-
      Загружайте только свои снимки. Фотографии других людей — только с их согласия.

      Автор сам решает, кому показывать профиль: всем или только по ссылке.
    help: |-
      Чтобы подписаться на автора или отметить снимок, нужно войти в «{{ w.brands.photo }}».

      Если фото не загружается, обновите страницу и проверьте подключение к сети.
  news:
    about: |-
      «{{ w.brands.news }}» — городской новостной портал. Редакция публикует материалы о событиях в городе и области.
    rules: |-
      Комментарии читателей проходят проверку. Оскорбления, реклама и призывы к насилию удаляются.

      Перепечатка материалов — только со ссылкой на портал.
    help: |-
      Чтобы оставить комментарий, нужно войти на портал.

      Сообщить о неточности в материале можно через форму обратной связи редакции.
  pharma:
    about: |-
      «{{ w.brands.pharma }}» — справочник лекарственных средств для чтения. Сведения собраны из общедоступных инструкций.
    rules: |-
      Справочник не заменяет консультацию врача. Не назначайте лекарства себе и другим по описанию из справочника.
    help: |-
      Искать препарат можно по торговому названию или по действующему веществу. Регистр букв и «ё» значения не имеют.
  cloud:
    about: |-
      «{{ w.brands.cloud }}» — личное облачное хранилище: папки, таблицы, переписки и документы под паролем.
    rules: |-
      Содержимое папок видит только владелец учётной записи. Передача пароля третьим лицам нарушает условия хранилища.
    help: |-
      Если пароль утерян, вход восстанавливается через владельца учётной записи.

      Папка с отдельным замком открывается только отдельным паролем.
  mail:
    about: |-
      «{{ w.brands.mail }}» — почтовый сервис: письма, папки и вложения в одном ящике.
    rules: |-
      Владелец ящика отвечает за содержимое своих писем. Массовые рассылки без согласия получателей запрещены.

      Сведения о письмах передаются третьим лицам только в случаях, предусмотренных законом.
    help: |-
      Письма в цепочке идут от старых к новым. Чтобы написать или ответить, войдите в почту «{{ w.brands.mail }}».

      Если вложение не открывается, попросите отправителя прислать его ещё раз.
