# Черновик сценариста (REDESIGN-2026-10 §4.3, схема §6.2). Сайт клуба «Закрытые вечера». Этап 4, ЗАКРЫТАЯ,
# попадают только по ссылке из облака (cloud): см. docs/drafts/pages/LINKS.md. QR нет (doc нет).
# Это «витрина» клуба: вещи описаны так, как их продавали. Лот с табакеркой совпадает с реестром облака
# (дата 16.11.2024, название, цена = w.money.snuffbox_rub) — но клуб называет её подлинником. Расхождение
# «витрина ↔ реестр» — мелкое подтверждение уже известного на этапе 4 (пометка в реестре, 4-11), не новая улика.
# Все строки архива взяты из реестра облака (дата, лот, цена совпадают); покупателей клуб не публикует.
# Нет: имени убийцы, Волкова, долгов, ООО, Громовой по имени. Ведущий — «Голос» (SCENARIO: Воронцов — «голос»),
# хозяин вечеров не назван. Расчёты через фонд — SCENARIO «Константы» и реестр («оформлено как взнос в фонд»).
# Шаг 2 (21.10, CLUE-MAP 3.8): ссылка на открытую страницу fund (закрытая этапа 4 → открытая этапа 1 — разрешено);
# «подлинность лота подтверждает казначей клуба» — для fb2: казначей по письму «Если вы это читаете» — Завьялов.
# 23.10 (решение автора «берём всё», docs/PRODUCTION.md §4.9): F08 — витринный кадр табакерки, X02 — три лота с фото.
# F08 — НЕ улика, а «эхо» fb2: опознание (тот же предмет, что в 4-11 и в строке реестра) и витринное «подлинник».
# На кадре только то, что описано в 4-11 и в таблице ниже: прямоугольная, серебро, позолота внутри, крышка с
# гильошированной эмалью. Дно и клейма не видны — признаки копии есть только в 4-11. Вещь без потёртостей (не спорит
# с 4-11 «естественного износа нет»), но кадр на это не указывает. Подписи повторяют описания клуба из таблицы.
slug: auction
type: site
stage: 4
locked: true
brand: "«{{ w.money.auctions }}»"
skin: auction
tagline: "Клуб ценителей старины и театра · только по приглашению"
sections:
  - id: club
    title: "Клуб"
    blocks:
      - kind: notice
        text: "Вход по приглашению. Если вы оказались здесь случайно, закройте страницу и забудьте адрес."
      - kind: text
        md: |
          «{{ w.money.auctions }}» — частный клуб для тех, кто ценит старые вещи и хороший театр. С 2016 года мы собираемся после спектакля, в узком кругу, при свечах. Каждая вещь на вечере — с историей, и каждую историю рассказывает Голос.

          Мы не публикуем имён — ни владельцев, ни покупателей. Мы не даём рекламы. О каждом вечере члены клуба узнают лично.
      - kind: notice
        text: "Сезон 2026/2027: вечера приостановлены. О возобновлении сообщим лично."

  - id: rules
    title: "Правила"
    blocks:
      - kind: text
        md: |
          1. Участие — только по личной рекомендации члена клуба.
          2. Лоты описывает клуб. Описание — часть истории вещи; документы, если они есть, передаются покупателю вместе с лотом. Подлинность лота подтверждает казначей клуба.
          3. Расчёт — наличными в вечер продажи или благотворительным взносом через [фонд «{{ w.money.fund }}»]({{ link('fund') }}), партнёра клуба.
          4. Лот вручается покупателю в тот же вечер.
          5. Всё, что сказано на вечере, остаётся на вечере.

  - id: archive
    title: "Архив лотов"
    blocks:
      - kind: text
        md: "Избранные лоты прошлых сезонов. Полный архив доступен членам клуба по запросу."
      - kind: photo
        file: "auction/snuffbox_lot.jpg"          # F08: витринный кадр клуба, «эхо» fb2 (см. шапку)
        caption: "Вечер 16.11.2024. Табакерка, серебро, клеймо придворного ювелира. Подлинник, частное собрание. Рекорд клуба"
        wide: true
      - kind: cards
        title: "Вещи с историей"
        items:
          - title: "Часы каминные, бронза с золочением, Франция, сер. XIX в."
            subtitle: "Вечер 21.10.2016 · первый лот клуба"
            text: "Клеймо механизма читается. Итог — 185 000 ₽."
            photo: "auction/lot-01.jpg"           # X02a
          - title: "Афиша «Маскарада», 1962 г., из архива театра"
            subtitle: "Вечер 18.11.2017 · театральная реликвия"
            text: "Благотворительный взнос. Итог — 29 000 ₽."
            photo: "auction/lot-02.jpg"           # X02b
          - title: "Макет декорации «Дом Нины», дерево, гипс, 1970-е"
            subtitle: "Вечер 15.11.2025 · театральная реликвия"
            text: "Благотворительный взнос. Итог — 47 000 ₽."
            photo: "auction/lot-03.jpg"           # X02c
      - kind: table
        columns: ["Вечер", "Лот", "Из описания клуба", "Итог, ₽"]
        rows:
          - ["21.10.2016", "Часы каминные, бронза с золочением, Франция, сер. XIX в.", "Первый лот клуба. Клеймо механизма читается.", "185 000"]
          - ["18.11.2017", "Афиша «Маскарада», 1962 г., из архива театра", "Театральная реликвия. Благотворительный взнос.", "29 000"]
          - ["15.03.2019", "Икона «Георгий Победоносец», письмо кон. XIX в., оклад латунь", "Экспертиза приложена.", "240 000"]
          - ["21.10.2022", "Картина: осенний лес, холст, масло, подпись неразборчива", "Экспертиза приложена.", "960 000"]
          - ["14.04.2023", "Картина: речной пейзаж, холст, масло, неизвестный художник XIX в.", "Подлинник, экспертиза приложена.", "650 000"]
          - ["16.11.2024", "Табакерка, серебро, клеймо придворного ювелира", "Прямоугольная, позолота внутри, крышка с гильошированной эмалью. Клеймо придворного ювелира, пробирные клейма. Подлинник, частное собрание. Рекорд клуба.", "{{ '{:,}'.format(w.money.snuffbox_rub)|replace(',', ' ') }}"]
          - ["15.11.2025", "Макет декорации «Дом Нины», дерево, гипс, 1970-е", "Театральная реликвия. Благотворительный взнос.", "47 000"]
          - ["05.06.2026", "Картина: берег после дождя, холст, масло, нач. XX в.", "Атрибуция условная. Последний лот сезона.", "570 000"]

  - id: join
    title: "Как попасть"
    blocks:
      - kind: text
        md: "Никак — если вас не пригласили. Если пригласили, вы уже знаете, где и когда."

