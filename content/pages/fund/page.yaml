# Черновик сценариста (REDESIGN-2026-10 §4.3, схема §6.2). Сайт благотворительного фонда «Сцена». Этап 1, открытая.
# Ссылки сюда: партнёры и карточка худрука на сайте theater.
# Строго (§4.4): председатель — {{ Завьялов }}, это публично; НИ сумм, ни договоров, ни декораций, ни подрядчиков,
# ни аукционов и «вечеров», ни реликвий, ни Громовой; отчёты — «по запросу».
# Шаг 2 (21.10, CLUE-MAP 3.8): одна строка об отчёте за 2025 год, переданном по запросу администрации города в октябре
# (спящая для s3.b3: 2-06 + 3-10). Ни имени Громовой, ни 10 ноября, ни сумм. Вольской здесь нет
# (на сайте театра она «друг театра», не фонда), чтобы не связывать её с деньгами фонда раньше этапа 4.
slug: fund
type: site
stage: 1
locked: false
brand: "Фонд «{{ w.money.fund }}»"
skin: fund
tagline: "Благотворительный фонд поддержки театрального искусства · {{ w.city }}"
sections:
  - id: about
    title: "О фонде"
    blocks:
      - kind: notice
        text: "Фонд «{{ w.money.fund }}» скорбит вместе с труппой {{ w.theater.short }}: 10 ноября {{ c.voroncov.g('ушёл', 'ушла') }} из жизни {{ c.voroncov.g('народный артист', 'народная артистка') }} {{ c.voroncov.io() }} {{ c.voroncov.last() }}."
      - kind: text
        md: |
          Благотворительный фонд «{{ w.money.fund }}» создан в 2009 году по инициативе артистов и друзей театра — {{ w.theater.short }}. Мы помогаем театру делать то, на что не всегда хватает бюджетной строки: возить спектакли в районы области, учить детей, поддерживать молодых артистов и беречь старые костюмы.

          Фонд не получает прибыли. Все средства направляются на уставные цели. Фондом руководит правление, за его работой следит попечительский совет, текущие дела ведёт исполнительный директор.

          Афиша и новости театра — на [сайте {{ w.theater.short }}]({{ link('theater') }}).

  - id: board
    title: "Правление и попечители"
    blocks:
      - kind: cards
        items:
          - { title: "{{ c.zavyalov.io() }} {{ c.zavyalov.last() }}", subtitle: "Председатель правления фонда", text: "Художественный руководитель {{ w.theater.short }}.", photo: null, page: theater }
          - { title: "Галина Фёдоровна Лапшина", subtitle: "Член попечительского совета", text: "Заслуженная артистка, почётный член труппы. Сорок лет на сцене театра.", photo: null }
          - { title: "Аркадий Ильич Сухарев", subtitle: "Член попечительского совета", text: "Предприниматель, давний зритель и друг театра.", photo: null }
          - { title: "Анна Владимировна Перова", subtitle: "Исполнительный директор фонда", text: "Отвечает на письма. Все письма. Даже те, что пришли на адрес театра.", photo: null }

  - id: projects
    title: "Проекты"
    blocks:
      - kind: cards
        items:
          - { title: "Детская театральная студия", subtitle: "с 2014 года", text: "Шестьдесят учеников от 7 до 16 лет, отчётные спектакли на малой сцене. Ближайший — «Аленький цветочек».", photo: null }
          - { title: "Театр — в районы", subtitle: "гастроли по области", text: "В прошлом сезоне — четырнадцать городов и сёл. Однажды играли в спортзале, сцену собрали из матов.", photo: null }
          - { title: "Стипендии молодым артистам", subtitle: "ежегодно", text: "Пять стипендий артистам труппы до 30 лет — на учёбу, мастер-классы и стажировки.", photo: null }
          - { title: "Вторая жизнь костюма", subtitle: "вместе с костюмерным цехом", text: "Реставрация исторических костюмов из подбора театра. Каждый костюм получает паспорт и бирку.", photo: null }

  - id: reports
    title: "Отчётность"
    blocks:
      - kind: notice
        text: "Отчёты — по запросу."
      - kind: text
        md: "Фонд ведёт деятельность открыто и в соответствии с законом. Годовые отчёты предоставляются по письменному запросу, направленному почтой на адрес фонда. Ответ — в течение тридцати дней с момента получения запроса."
      - kind: text
        md: "Годовой отчёт фонда за 2025 год передан в октябре 2026 года по запросу администрации города. Рассмотрение запланировано на ноябрь."

  - id: help
    title: "Помочь"
    blocks:
      - kind: text
        md: "Поддержать фонд может каждый. Пожертвования принимаются на расчётный счёт фонда; реквизиты высылаются по запросу. Можно помочь и делом: волонтёры нужны на гастролях, в детской студии и на субботниках в костюмерном цехе — там всегда есть что подшить."

  - id: contacts
    title: "Контакты"
    blocks:
      - kind: text
        md: |
          - **Адрес:** {{ w.city }}, {{ w.theater.address }}, 2-й этаж, административный коридор.
          - **Приём посетителей:** по предварительной договорённости.
          - **Почтовый адрес для запросов:** тот же, с пометкой «Фонд „{{ w.money.fund }}“».

footer: "© Благотворительный фонд «{{ w.money.fund }}», 2009–2026."
