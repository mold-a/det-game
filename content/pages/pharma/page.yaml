# Все карточки в одном формате; нужная ничем не выделена.
# Медицинские сведения сверить с официальными инструкциями перед продажей.
drugs:
  - name: "Пропранолол"
    trade: ["Анаприлин", "Обзидан"]
    group: "Бета-адреноблокатор неселективный"
    indications: "Артериальная гипертензия, стенокардия, нарушения сердечного ритма, профилактика мигрени, эссенциальный тремор."
    contraindications: "Бронхиальная астма и склонность к бронхоспазму, синусовая брадикардия, атриовентрикулярная блокада II–III степени, кардиогенный шок, выраженная сердечная недостаточность, повышенная чувствительность."
    side_effects: "Брадикардия, слабость, головокружение, похолодание конечностей, бронхоспазм."
  - name: "Сальбутамол"
    trade: ["Вентолин", "Саламол"]
    group: "Бронхолитик, селективный бета2-адреномиметик"
    indications: "Купирование и профилактика приступов бронхиальной астмы."
    contraindications: "Повышенная чувствительность к компонентам."
    side_effects: "Тремор, тахикардия, головная боль."
  - name: "Кофеин"
    trade: ["Кофеин-бензоат натрия"]
    group: "Психостимулятор"
    indications: "Сонливость, снижение умственной и физической работоспособности."
    contraindications: "Повышенная возбудимость, бессонница, выраженная артериальная гипертензия, тяжёлые нарушения сердечного ритма."
    side_effects: "Тахикардия, бессонница, беспокойство."
  - name: "Валерианы экстракт (валереновая кислота)"   # «Седарин» — вымышленное торговое название
    trade: ["Седарин"]
    group: "Седативное средство растительного происхождения"
    indications: "Нервное напряжение, раздражительность, нарушения засыпания."
    contraindications: "Повышенная чувствительность к компонентам, возраст до 12 лет."
    side_effects: "Сонливость, снижение концентрации внимания."
  # Препараты-«соседи» (P10): общеизвестные сведения из инструкций; сверить перед печатью/продажей.
  - name: "Парацетамол"
    trade: ["Панадол", "Эффералган"]
    group: "Анальгетик-антипиретик"
    indications: "Боль слабой и умеренной интенсивности (головная, зубная, мышечная), лихорадка."
    contraindications: "Повышенная чувствительность, тяжёлая печёночная и почечная недостаточность."
    side_effects: "Редко — аллергические реакции, тошнота; при передозировке — поражение печени."
  - name: "Лоратадин"
    trade: ["Кларитин", "Кларотадин"]
    group: "Антигистаминное средство, блокатор H1-гистаминовых рецепторов"
    indications: "Аллергический ринит, крапивница, аллергические кожные реакции."
    contraindications: "Повышенная чувствительность, детский возраст до 2 лет."
    side_effects: "Головная боль, сухость во рту, утомляемость."
  - name: "Омепразол"
    trade: ["Омез", "Лосек"]
    group: "Ингибитор протонной помпы"
    indications: "Язвенная болезнь желудка и двенадцатиперстной кишки, гастроэзофагеальная рефлюксная болезнь, изжога."
    contraindications: "Повышенная чувствительность, одновременный приём с нелфинавиром."
    side_effects: "Головная боль, диарея, запор, боль в животе, тошнота."
  - name: "Амлодипин"
    trade: ["Норваск", "Нормодипин"]
    group: "Блокатор медленных кальциевых каналов"
    indications: "Артериальная гипертензия, стабильная стенокардия."
    contraindications: "Повышенная чувствительность, выраженная артериальная гипотензия, кардиогенный шок."
    side_effects: "Отёки лодыжек, головная боль, приливы крови к лицу, сердцебиение."
  - name: "Дротаверин"
    trade: ["Но-шпа"]
    group: "Миотропный спазмолитик"
    indications: "Спазмы гладкой мускулатуры: кишечная и почечная колика, спастические боли в животе."
    contraindications: "Повышенная чувствительность, тяжёлая печёночная, почечная или сердечная недостаточность."
    side_effects: "Головная боль, головокружение, снижение артериального давления, тошнота."
