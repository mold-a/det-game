# 25.10, вечер (замечание автора): заключительный экран «Спасибо за игру» — после судеб (поле Thanks: title, text, signature;
# счёт и ранг команды сайт выводит сам). Без новых сюжетных фактов, кроме итога в одну строку.
thanks:
  title: "Спасибо за игру"
  text: |
    Коллеги, дело закрыто. Точнее, наоборот: возбуждено, доведено до суда и закрыто приговором. Доклад к десяти утра пятнадцатого ноября ушёл наверх вовремя, и в нём было не слово «сердце», а имена.

    {{ c.voroncov.last() }} хотел, чтобы правду о «{{ w.money.auctions }}» рассказали за него, если сам он не успеет. Её рассказали вы: по журналам, протоколам, чужим перепискам и одной таблетке в отделении субботы.

    Спасибо, что дошли до конца. Спасибо, что спорили, перечитывали, ошибались и снова садились за документы. Стаканы, как и обещал, полные. Чай, правда, остыл: слишком долго вы читали мои протоколы.
  signature: "Майор юстиции {{ c.belyaev.short() }} и авторы игры"
