# Развязка — одна для всех. Показывается после отправки финальных ответов.
confession: "documents/R-01-confession.md"   # протокол допроса исполнителя
letter: "documents/R-01-letter.md"           # письмо погибшего крестнице (папка «Для <инициал Марины>.» в облаке)
fates:
  - { who: volkov,    text: "{{ c.volkov.g('Осуждён', 'Осуждена') }} к 13 годам лишения свободы за убийство группой лиц по предварительному сговору." }
  - { who: zavyalov,  text: "{{ c.zavyalov.g('Осуждён', 'Осуждена') }} к 16 годам как организатор. Дело об аукционах и отмыве средств выделено в отдельное производство." }
  - { who: marina,    text: "{{ c.marina.g('Уехал', 'Уехала') }} к сестре в другой город. Деньги из чемодана изъяты как доход от аукционов." }
  - { who: kirill,    text: "Свидетель обвинения. После того как архив приобщили к делу, {{ c.kirill.g('удалил', 'удалила') }} облако." }
  - { who: volskaya,  text: "{{ c.volskaya.g('Свидетель', 'Свидетельница') }} по делу об аукционах. Табакерка стала вещественным доказательством, деньги за неё вернули по решению суда. {{ c.volskaya.g('Учредил', 'Учредила') }} в театре стипендию имени {{ c.voroncov.last('gen') }}." }
  - { who: gromov,    text: "Прогул всплыл в протоколах — выговор. Замять дело не удалось: после того как реестр «{{ w.money.auctions }}» приобщили к делу, началась служебная проверка, и {{ c.gromov.short() }} {{ c.gromov.g('ушёл', 'ушла') }} в отставку." }
  - { who: inna,      text: "{{ c.inna.g('Уволен', 'Уволена') }} после проверки костюмерного цеха." }
  - { who: oleg,      text: "{{ c.oleg.g('Уволен', 'Уволена') }} за оставленный пост." }
  - { who: stas,      text: "{{ c.stas.g('Дал', 'Дала') }} показания о ссоре в антракте. {{ c.stas.g('Остался', 'Осталась') }} в труппе." }
  - { who: reznikova, text: "Журнал помощника режиссёра приобщён к делу как доказательство. {{ c.reznikova.g('Остался', 'Осталась') }} в театре." }
  - { who: gnedich,   text: "После проверки {{ c.gnedich.g('завёл', 'завела') }} в костюмерном цехе опись с фотографией каждой вещи." }
  - { who: viktor,    text: "Журнал светового пульта приобщён к делу. По-прежнему ведёт свет на всех премьерах театра." }
  - { who: dmitriy,   text: "{{ c.dmitriy.g('Дал', 'Дала') }} показания о последнем дне {{ c.voroncov.last('gen') }}. {{ c.dmitriy.g('Перешёл', 'Перешла') }} работать в другую организацию." }
  - { who: null,      text: "У театра новый художественный руководитель. Через год «{{ w.play.title }}» возвращается в репертуар с новым Арбениным." }
