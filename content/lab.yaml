name: "{{ w.brands.lab }}"
full_name: "{{ w.brands.lab_full }}"
tagline: "Разложим по спектру. Соберём в заключение."

about: |
  {{ w.brands.lab_full }} работает в {{ w.city_pre }} с 2011 года. Нас основали четыре эксперта, которым надоело ждать реактивы по полгода, а заказчиков — по году. Помещение досталось от закрытой фабрики оптического стекла: отсюда название, высокие потолки и стеклянная призма на подоконнике в приёмной. Её не трогают — говорят, приносит удачу и ровный свет.

  За пятнадцать лет мы выполнили больше девяти тысяч исследований. Наши заказчики — следственные органы, суды, адвокаты, страховые компании и частные лица. Со {{ w.police.department|replace('Следственный отдел', 'следственным отделом') }} у нас договор: заявки следователей принимаются через личный кабинет заказчика и выполняются вне общей очереди. Однажды мы по заявке садового товарищества установили, чья курица разорила грядки. Курица свою вину не признала, но заключение суд принял.

  Судебно-медицинские и судебно-химические исследования по направлениям следствия мы выполняем совместно с бюро судебно-медицинской экспертизы {{ w.city_gen }}: объекты поступают к нам, исследование ведёт эксперт бюро на нашем оборудовании, заключение оформляется на бланке бюро. Так быстрее для всех, и никто не спорит, чей хроматограф лучше. Он у нас один, и сотрудники ласково зовут его Самоваром.

  Мы не строим версий и не ищем виноватых: на это есть следствие. Мы отвечаем на поставленные вопросы — точно, в срок и ровно настолько, насколько позволяют объект и наука. Если исследовать нечего, так и пишем.

accreditation: "Аттестат аккредитации экспертной организации № ЭО-047/11, выдан Областной палатой судебных экспертов, действует до 31.12.2028. Член Ассоциации независимых экспертных центров Приречья."

