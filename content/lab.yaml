services_note: "Срок исследования — 1 рабочий день. Заявка принимается только с основанием: укажите документ из материалов дела, из которого видно, зачем нужно исследование. Предмет называйте так, как он записан в описи изъятого. Повторная заявка с тем же объектом, видом и основанием не оплачивается. Исследование, которое ничего не выявило, — тоже исследование: оплачивается в полном объёме."
