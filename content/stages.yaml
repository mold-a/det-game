  # ================================================================== ЭТАП 4 (финал)
  - n: 4
    envelope: 4
    intro: |
      **Коллеги,**

      друг погибшего слово сдержал: архив {{ c.voroncov.last('gen') }} у нас. Публикацию, назначенную на 10:04, отложат, как только архив приобщат к делу. Одна папка в облаке закрыта отдельным паролем. Не ломайте её: она личная.

      Мы знаем, что убило {{ c.voroncov.last('acc') }}. Теперь нужно понять, кто это сделал и зачем. Ответ «так получилось» не принимается.

      Наши запросы теперь выходят за стены театра:
      - по результатам химии запросы ушли во все аптеки города: кто покупал этот препарат с начала августа. Первый ответ — 4-04;
      - в театре — почему не работала камера в коридоре гримёрок (4-05) и рабочий чат труппы (4-06): кто где должен был быть на премьере;
      - фонд «{{ w.money.fund }}» платил за декорации к премьере — запросил смету с договором (4-02), выписку на подрядчика (4-03) и у почтового сервиса — служебную почту фонда за осень (4-15);
      - у тех, кому нечем подтвердить, где они были в первом акте, проверяю всё, что они предъявили: видеозапись с телефона скопирована (4-07);
      - к {{ c.volskaya.short('dat') }}, как и обещал, вернулся — на этот раз {{ c.volskaya.g('он', 'она') }} отдал{{ c.volskaya.g('', 'а') }} письмо и переписку (4-11, 4-12);
      - {{ c.gnedich.short() }} {{ c.gnedich.g('пришёл', 'пришла') }} сам{{ c.gnedich.g('', 'а') }} (4-09), {{ c.marina.short('acc') }} пришлось опросить в третий раз (4-14).

      «{{ w.brands.lab }}» ждёт ваших запросов; основания — документы. Телефон погибшего так и не нашли, но у его номера есть оператор связи. Вокзал хранит записи своих камер тридцать суток.

      **Ответ, отправленный в финале, изменить нельзя.** Бонусы прошлых этапов закроются, как только вы начнёте финал. Сначала все материалы, потом выводы.

      Раскроете — налью всем. Чаю: стаканы у нас в отделе только под чай.

      Майор юстиции {{ c.belyaev.short() }}
    questions:
