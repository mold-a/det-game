      - {{ c.gnedich.short() }} {{ c.gnedich.g('пришёл', 'пришла') }} сам{{ c.gnedich.g('', 'а') }} (4-09), {{ c.marina.short('acc') }} пришлось опросить в третий раз (4-14).

      «{{ w.brands.lab }}» ждёт ваших запросов; основания — документы. Сегодня у всех, с кем я говорил под протокол, взяты образцы отпечатков пальцев: если где-то найдутся чужие следы, сравнить есть с чем. Телефон погибшего так и не нашли, но у его номера есть оператор связи. Вокзал хранит записи своих камер тридцать суток.

