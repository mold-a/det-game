# Этапы, вопросы, ответы, подсказки.
# Путь единицы: s<n>.<question.id>[.<field.id>] — участвует в криптографии, не переименовывать после печати QR.
# Все строки — шаблоны Jinja2 (c — персонажи, w — мир).
# Подсказки: [уровень 1 — куда смотреть, уровень 2 — что сопоставить, уровень 3 — ответ].

stages:
  # ================================================================== ЭТАП 1
  - n: 1
    envelope: 1
    # Требование к вводному письму этапа 1: без слов о причине смерти и болезни погибшего (спойлер этапов 1–3);
    # текст попадает в pack-1, ключ которого выводится из публичных данных.
    intro: |
      **Коллеги!**

      Во вторник, 10 ноября, на премьере спектакля «{{ w.play.title }}» прямо на сцене {{ w.theater.short }} умер народный артист {{ c.voroncov.io() }} {{ c.voroncov.last() }}. Полный зал, скорая, наряд полиции, наутро — некрологи. Версия есть, и она всех устраивает: смерть естественная.

      Устраивает почти всех. 11 ноября в 07:50 в дежурную часть позвонил человек, который не назвался, и сказал, что {{ c.voroncov.last() }} умер «не просто так». На вопрос, кто говорит, положил трубку. Запись — по QR-коду в папке.

      Одновременно звонят сверху: заместитель главы администрации города {{ c.gromov.short() }} просит не раздувать и закрыть материал побыстрее. Сверху просят тишины, снизу — анонимно — шума. Мне не нужно ни то ни другое. Мне нужен ответ.

      **Задача группы:** к 10:00 13 ноября установить, есть ли в обстоятельствах смерти признаки преступления. Почему именно к этому часу — не спрашивайте: срок не мой, и сдвинуть его нельзя.

      Начните с простого: заполните справку о погибшем и восстановите вечер по порядку — кто когда пришёл, где был, что видел. Всё нужное — в папке. Работаем по документам, а не по некрологам.

      Ответы — только через «{{ w.brands.system }}». Экспертизы делает «{{ w.brands.lab }}», у отдела с ними договор; заявки — через их личный кабинет. Предмет называйте так, как он записан в описи, и укажите основание — документ, из которого видно, зачем экспертиза нужна. Пустая экспертиза стоит столько же, сколько полезная. Подсказки система выдаёт, но не бесплатно. Конверты вскрывать по её команде и не раньше: любопытство я ценю, самодеятельность — нет.

      Майор юстиции {{ c.belyaev.short() }}
    on_complete: "Ответ принят. Вскройте конверт № 2."
    questions:
      - id: q1
        kind: mandatory
        type: form
        prompt: "Заполните справку о погибшем."
        fields:
          - id: time
            type: time
            label: "Время констатации смерти"
            answer: { canon: "21:18", tolerance_min: 0 }
          - id: conflict
            type: person
            label: "С кем у погибшего был конфликт в день смерти"
            pool: default
            answer: { canon: zavyalov }
          - id: disease
            type: text
            label: "Хронические заболевания"
            answer:
              canon: "астма"
              variants: ["бронхиальная астма", "астма бронхиальная", "астму", "бронхиальную астму"]
          - id: delivered
            type: person
            label: "Кто доставил погибшего в театр"
            pool: default
            answer: { canon: dmitriy }
        hints:
          - "Все четыре ответа есть в документах папки. Начните с карты вызова скорой (1-03) и протоколов опроса (1-08)."
          - "Время — в карте вызова: нужна констатация, а не падение. Про конфликт и про то, чем болел погибший, {{ c.stas.g('проговорился', 'проговорилась') }} {{ c.stas.last() }}: вспомните {{ c.stas.g('его', 'её') }} слова про «баллончик». Кто привёз погибшего — в опросе водителя."
          - "21:18; {{ c.zavyalov.short() }}; астма; {{ c.dmitriy.short() }}."

      - id: q2
        kind: mandatory
        type: order
        prompt: "Расставьте события вечера 10 ноября в хронологическом порядке."
        items:
          - { id: k3, text: "{{ c.voroncov.last() }} проходит через служебный вход" }
          - { id: p8, text: "{{ c.volkov.last() }} проходит через служебный вход" }
          - { id: d1, text: "{{ c.volskaya.last() }} ищет {{ c.voroncov.last('acc') }}" }
          - { id: x5, text: "Начинается первый акт" }
          - { id: m2, text: "Ссора в гримёрке № {{ w.theater.dressing_room_victim }}" }
          - { id: t7, text: "Вызвана скорая помощь" }
          - { id: b9, text: "Прибывает наряд полиции" }
          - { id: r4, text: "{{ c.gromov.last() }} пытается уйти через ложи" }
        answer: { canon: [k3, p8, d1, x5, m2, t7, b9, r4] }   # ID нарочно не по порядку
        hints:
          - "У почти каждого события есть время в документах. Выпишите их в столбик."
          - "Журнал охраны (1-11) — два прихода. Опрос {{ c.volskaya.last('gen') }} — когда {{ c.volskaya.g('он искал', 'она искала') }} погибшего. Программка (1-07) — начало акта и антракт, а ссора была в антракте. Карта вызова (1-03) и рапорт (1-02) — события после падения."
          - "17:40 {{ c.voroncov.last() }} → 18:02 {{ c.volkov.last() }} → 18:20 {{ c.volskaya.last() }} → 19:00 первый акт → антракт, ссора → 21:04 скорая → 21:14 полиция → 21:20 {{ c.gromov.last() }}."

      - id: b1
        kind: bonus
        type: text
        prompt: "Где, по официальной информации, {{ c.gromov.g('находился', 'находилась') }} {{ c.gromov.short() }} вечером 10 ноября?"
        leak_scan: false   # ответ законно виден на открытой странице gromov (геометка поста)
        answer:
          canon: "{{ w.neighbor_city }}"
          variants: ["{{ w.neighbor_city_pre }}", "в {{ w.neighbor_city_pre }}", "г {{ w.neighbor_city }}", "город {{ w.neighbor_city }}"]

  # ================================================================== ЭТАП 2
  - n: 2
    envelope: 2
    intro: |
      **Коллеги,**

      справка о погибшем принята. Смерть по-прежнему выглядит естественной, и наверху этим очень довольны. Я — меньше.

      Одно уже не сходится. {{ c.voroncov.last() }} был серьёзно болен, а в театре об этом, похоже, не знал никто: свою болезнь он прятал. Годами такое в одиночку не скроешь. Кто знал — и что именно? Утром повторно {{ c.marina.g('опрошен', 'опрошена') }} {{ c.marina.g('крестник', 'крестница') }} погибшего, протокол — в конверте.

      Второй вопрос — его вещи. Пока хозяин был на сцене, гримёрка № {{ w.theater.dressing_room_victim }} пустовала, а камера в коридоре не работает с конца октября. Кто и когда мог туда попасть? Охрана служебного входа уверяет, что муха не пролетела. В мух я верю. В людей — проверяю.

      Нужен первый акт по минутам: где был каждый и кто это подтверждает. Подтверждение — это камера, журнал или другой человек. Собственное честное слово подтверждением не считается, даже очень честное.

      В конверте № 2 — повторные опросы, записи и журналы за тот вечер, фотографии, опись и справка пресс-службы администрации. Справка короткая и очень уверенная. В лаборатории появились новые объекты.

      До доклада меньше суток. Работаем.

      Майор юстиции {{ c.belyaev.short() }}
    on_complete: "Ответ принят. Вскройте конверт № 3."
    questions:
      - id: q1
        kind: mandatory
        type: form
        prompt: "Восстановите перемещения охранника служебного входа с 19:00 до 20:00."
        fields:
          - id: left
            type: time
            label: "Во сколько {{ c.oleg.g('он покинул', 'она покинула') }} пост"
            answer: { canon: "19:35", tolerance_min: 2 }
          - id: back
            type: time
            label: "Во сколько {{ c.oleg.g('вернулся', 'вернулась') }}"
            answer: { canon: "19:50", tolerance_min: 2 }
        hints:
          - "{{ c.oleg.last() }} утверждает, что не {{ c.oleg.g('отходил', 'отходила') }} от поста. Проверьте это по другому источнику."
          - "Кадры наружной камеры (2-03) — время в углу кадра. Сравните с повторным опросом охранника (2-04)."
          - "{{ c.oleg.g('Ушёл', 'Ушла') }} в 19:35, {{ c.oleg.g('вернулся', 'вернулась') }} в 19:50."

      - id: q2
        kind: mandatory
        type: persons
        prompt: "Чьё местонахождение с 19:30 до 20:00 подтверждено независимыми источниками?"
        help: "Подтверждение — показания других людей, журналы, камеры, технические записи. Слова самого человека и то, что он сам предъявил, — не подтверждение."
        pool: [zavyalov, volkov, marina, kirill, stas, reznikova, gnedich, viktor, oleg, inna, dmitriy, volskaya, gromov]
        answer: { canon: [marina, stas, reznikova, gnedich, viktor, oleg, dmitriy, volskaya, gromov] }
        hints:
          - "Пройдитесь по каждому человеку: был ли с ним кто-то ещё, или его видно на записи?"
          - "Помогут журнал помрежа (2-05), журнал светового пульта (2-07) и кадры наружной камеры (2-03) — на них видно не только охранника, — а ещё отметки в протоколах первых опросов (1-08: кто был рядом с опрошенным и что сказали другие) и рапорт сержанта (1-02). Подтверждения нет у четырёх человек."
          - "Подтверждено у: {{ c.marina.last('gen') }}, {{ c.stas.last('gen') }}, {{ c.reznikova.last('gen') }}, {{ c.gnedich.last('gen') }}, {{ c.viktor.last('gen') }}, {{ c.oleg.last('gen') }}, {{ c.dmitriy.last('gen') }}, {{ c.volskaya.last('gen') }}, {{ c.gromov.last('gen') }}. Не подтверждено у: {{ c.zavyalov.last('gen') }}, {{ c.volkov.last('gen') }}, {{ c.kirill.last('gen') }}, {{ c.inna.last('gen') }}."

      - id: b1
        kind: bonus
        type: choice
        prompt: "Почему {{ c.gromov.short() }} {{ c.gromov.g('пытался', 'пыталась') }} уйти из театра?"
        options:
          - { id: o1, text: "{{ c.gromov.g('Опасался', 'Опасалась') }} вопросов полиции по давнему делу" }
          - { id: o2, text: "{{ c.gromov.g('Опаздывал', 'Опаздывала') }} на самолёт" }
          - { id: o3, text: "Официально в это время {{ c.gromov.g('он был', 'она была') }} на совещании в другом городе" }
          - { id: o4, text: "Не {{ c.gromov.g('хотел', 'хотела') }} попасть в объективы журналистов из-за семейного скандала" }
          - { id: o5, text: "Плохо себя {{ c.gromov.g('почувствовал', 'почувствовала') }}" }
        answer: { canon: o3 }

      # Бонус s2.b2 (решение автора 21.10, CLUE-MAP 3.3): ложный след Инны закрывается на этапе 2.
      # Решается только вместе: опись 2-08 (брошь № 7 не обнаружена, приметы) + страница «Кадр» (QR 2-09, фото 11.11 в той же броши).
      # Неверные варианты: три — то, что Инна сама рассказала в 1-08 (кофе в 18:40, чай по гримёркам, чашки), т. е. не скрывала;
      # один — ничем не подтверждённая догадка.
      - id: b2
        kind: bonus
        type: choice
        prompt: "Что {{ c.inna.short() }} {{ c.inna.g('скрывал', 'скрывала') }} от следствия?"
        options:
          - { id: coffee, text: "{{ c.inna.g('Отнёс', 'Отнесла') }} погибшему кофе перед спектаклем" }
          - { id: saw, text: "{{ c.inna.g('Видел', 'Видела') }}, кто заходил в гримёрку № {{ w.theater.dressing_room_victim }}" }
          - { id: costume, text: "{{ c.inna.g('Брал', 'Брала') }} вещи из костюмерного цеха" }
          - { id: tea, text: "В первом акте {{ c.inna.g('носил', 'носила') }} чай по гримёркам" }
          - { id: cups, text: "{{ c.inna.g('Забрал', 'Забрала') }} чашки из гримёрок до осмотра" }
        answer: { canon: costume }

  # ================================================================== ЭТАП 3
  - n: 3
    envelope: 3
    intro: |
      **Коллеги,**

      окно установлено. В первом акте пост служебного входа четверть часа пустовал, камера в коридоре гримёрок не работала, гримёрка № {{ w.theater.dressing_room_victim }} стояла без хозяина. Пятнадцать минут — немного. Но кое-что за это время успеть можно.

      Теперь главный вопрос: что {{ c.voroncov.last() }} принял в тот вечер — и могло ли это его убить. Лаборатория готова работать с образцами — с любыми, на которые у вас найдутся основания. Без оснований — сами знаете.

      В конверте № 3 — повторные опросы тех, кому нашлось что добавить, и материалы, которые нам передали сегодня. Друг погибшего согласился поговорить ещё раз. Подозреваю, что после этого разговора срок «к 10:00» перестанет быть загадкой и станет поводом торопиться.

      {{ c.gromov.short() }} наконец {{ c.gromov.g('дал', 'дала') }} письменное объяснение. Звонить мне {{ c.gromov.g('он', 'она') }} при этом не {{ c.gromov.g('перестал', 'перестала') }}.

      И не забывайте открытые страницы: в соцсетях люди рассказывают о себе больше, чем на опросе. Особенно те, кто уверен, что их никто не читает.

      Версия «естественная смерть» пока держится. Но уже не так уверенно, как утром.

      Майор юстиции {{ c.belyaev.short() }}
    on_complete: "Ответ принят. Вскройте конверт № 4."
    questions:
      - id: q1
        kind: mandatory
        type: text
        prompt: "Какое из обнаруженных в крови веществ могло вызвать смерть?"
        answer:
          canon: "пропранолол"
          variants: ["пропранолола", "пропранолол гидрохлорид", "пропранолола гидрохлорид", "анаприлин", "обзидан", "propranolol"]
        hints:
          - "Сначала нужен результат исследования крови: запросите его в лаборатории, основание — протокол, где говорится, что погибший что-то принял. Потом выясните, что такое каждое вещество."
          - "Лаборатория: «Образцы крови погибшего» → «Химическое исследование» → основание 3-01 или 2-02. Ингалятор и успокоительное у погибшего были свои — о них {{ c.marina.g('рассказал', 'рассказала') }} {{ c.marina.last() }} (2-02). Оставшиеся вещества найдите в интернете или в справочнике по QR-коду из конверта 3."
          - "Пропранолол."

      - id: q2
        kind: mandatory
        type: choice
        prompt: "Почему это вещество было опасно для погибшего?"
        options:
          - { id: o1, text: "Передозировка: доза превышала допустимую" }
          - { id: o2, text: "Несовместимость с алкоголем" }
          - { id: o3, text: "Аллергическая реакция" }
          - { id: o4, text: "Противопоказано при заболевании, которое у него было" }
          - { id: o5, text: "Опасное сочетание с кофеином" }
        answer: { canon: o4 }
        hints:
          - "Что вы знаете о здоровье погибшего?"
          - "Найдите противопоказания этого вещества и сравните с тем, о чём {{ c.marina.g('рассказал', 'рассказала') }} {{ c.marina.last() }} (2-02)."
          - "Противопоказано при бронхиальной астме: вызывает спазм бронхов."

      - id: q3
        kind: mandatory
        type: form
        prompt: "Как вещество попало в организм погибшего?"
        fields:
          - id: how
            type: choice
            label: "Способ"
            options:
              - { id: self_rx, text: "Принял сам по назначению врача" }
              - { id: self_norx, text: "Принял сам без назначения" }
              - { id: pharmacy, text: "Ошибка аптеки" }
              - { id: food, text: "Подмешали в еду или напиток" }
              - { id: swapped, text: "Подменили его лекарство" }
            answer: { canon: swapped }
          - id: doc
            type: document
            label: "Какой документ это подтверждает"
            answer: { canon: "3-06" }
        hints:
          - "Был ли у погибшего рецепт на это вещество? Что он принимал на самом деле? Таблетницу описали при осмотре, но не исследовали: для заявки нужно основание из документов этапа 3."
          - "Запросите в лаборатории исследование таблетницы. Основание — документ, из которого видно, что погибший принимал таблетку в тот вечер или что он принимал на самом деле (например, 3-01 или 3-04). Посмотрите, чем отличаются таблетки в разных отделениях."
          - "Подменили его лекарство; подтверждает исследование таблетницы (3-06)."

      - id: b1
        kind: bonus
        type: form
        prompt: "Что погибший планировал сделать после спектакля?"
        fields:
          - id: plan
            type: choice
            label: "План"
            options:
              - { id: journalist, text: "Встретиться с журналистом" }
              - { id: train, text: "Уехать из города поездом" }
              - { id: volskaya, text: "Встретиться с {{ c.volskaya.last('ins') }}" }
              - { id: banquet, text: "Пойти на банкет в честь премьеры" }
              - { id: kirill, text: "Встретиться с {{ c.kirill.first('ins') }}" }
            answer: { canon: train }
          - id: time
            type: time
            label: "Во сколько"
            answer: { canon: "{{ w.train.departure }}", tolerance_min: 0 }

      - id: b2
        kind: bonus
        type: person
        prompt: "Кто сделал анонимный звонок в дежурную часть?"
        pool: default
        answer: { canon: kirill }

      - id: b3
        kind: bonus
        type: choice
        prompt: "Зачем {{ c.gromov.short() }} на самом деле {{ c.gromov.g('приезжал', 'приезжала') }} в театр 10 ноября?"
        options:
          - { id: incognito, text: "Посмотреть премьеру неофициально, без протокола" }
          - { id: voroncov, text: "Встретиться с {{ c.voroncov.last('ins') }}" }
          - { id: fund, text: "Встретиться с {{ c.zavyalov.last('ins') }} по поводу денег фонда «{{ w.money.fund }}»" }
          - { id: governor, text: "Проверить готовность театра к визиту губернатора" }
          - { id: volskaya, text: "Передать {{ c.volskaya.last('dat') }} документы" }
        answer: { canon: fund }

  # ================================================================== ЭТАП 4 (финал)
  - n: 4
    envelope: 4
    intro: |
      **Коллеги,**

      у следствия есть доступ к архиву погибшего. Его друг слово сдержал: пароль от облака — в записке, она в конверте № 4. Публикация назначена на завтра, на 10:04; её отложат, как только архив будет приобщён к делу. Одна папка в облаке закрыта отдельным паролем. Не ломайте её: она личная, и откроем мы её при том, кому она адресована.

