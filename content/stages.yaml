# Этапы, вопросы, ответы, подсказки.
# Путь единицы: s<n>.<question.id>[.<field.id>] — участвует в криптографии, не переименовывать после печати QR.
# Все строки — шаблоны Jinja2 (c — персонажи, w — мир).
# Подсказки: [уровень 1 — куда смотреть, уровень 2 — что сопоставить, уровень 3 — ответ].

stages:
  # ================================================================== ЭТАП 1
  - n: 1
    envelope: 1
    # Требование к вводному письму этапа 1: без слов о причине смерти и болезни погибшего (спойлер этапов 1–3);
    # текст попадает в pack-1, ключ которого выводится из публичных данных.
    # 25.10 (замечание автора): завязка без пересказа звонка — только факт; запись игроки слушают сами (QR на письме 1-01 и на приложении 1-05).
    # Письмо 1-01 в папке говорит о том же другими словами — дословных повторов нет.
    # 25.10 (решение автора): запись архивной камеры (приложение 2 к письму, 1-15, страница archive) — без того, что в кадре; 1-05 и 1-15 — приложения к письму, не отдельные листы.
    intro: |
      **Коллеги!**

      На премьере в {{ w.theater.short }} при полном зале умер человек. Архивная камера театра это сняла. Объяснение нашлось быстро и устроило всех: смерть естественная. Всех, кроме одного звонившего, который не захотел назваться. Звонок записан — послушайте его сами, мой пересказ вам ни к чему. Запись звонка и фрагмент архивной записи приложены к письму: QR-коды на самом письме и на приложениях. Сверху тем временем просят закрыть материал поскорее. Подробности — в папке дела, моё письмо там первое.

      **Задача группы:** до 10:00 15 ноября понять, была ли эта смерть преступлением. Срок не обсуждается и не переносится.

      Как работаем. Ответы — только здесь, в «{{ w.brands.system }}». Экспертизы делает «{{ w.brands.lab }}», у отдела с ними договор; заявки — через их личный кабинет. Предмет называйте так, как он записан в описи, и укажите основание — документ, из которого видно, зачем экспертиза нужна. Пустая экспертиза — штраф группе, а не лаборатории. Подсказки система выдаёт, но не бесплатно. Конверты вскрывать по её команде и не раньше: любопытство я ценю, самодеятельность — нет.

      Майор юстиции {{ c.belyaev.short() }}
    on_complete: "Ответ принят. Вскройте конверт № 2."
    questions:
      - id: q1
        kind: mandatory
        type: form
        prompt: "Заполните справку о погибшем."
        fields:
          - id: time
            type: time
            label: "Время констатации смерти"
            answer: { canon: "21:18", tolerance_min: 0 }
          - id: conflict
            type: person
            label: "С кем у погибшего был конфликт в день смерти"
            # 25.10, вечер (правило автора): в списке только те, кого игрок видел в конверте 1 как участника событий
            # (показания 1-08, 1-14, рапорт 1-02, письмо 1-01, пункты s1.q2). Инна, Гнедич, Виктор — только строки журнала 1-11
            # и титры 1-07: их на этапе 1 нет. Верные ответы не первыми.
            pool: [volskaya, stas, gromov, zavyalov, marina, reznikova, oleg, kirill, dmitriy, volkov]
            answer: { canon: zavyalov }
          - id: disease
            type: text
            label: "Хронические заболевания"
            answer:
              canon: "астма"
              variants: ["бронхиальная астма", "астма бронхиальная", "астму", "бронхиальную астму", "астмой", "бронхиальной астмой", "БА"]   # 30.10 (S-150): + «астмой», «бронхиальной астмой», «БА»
          - id: delivered
            type: person
            label: "Кто доставил погибшего в театр"
            pool: [volskaya, stas, gromov, zavyalov, marina, reznikova, oleg, kirill, dmitriy, volkov]   # тот же список, что у conflict
            answer: { canon: dmitriy }
        hints:
          - "Все четыре ответа есть в документах папки. Начните с карты вызова скорой (1-03) и объяснений (1-08)."
          - "Время — в карте вызова: нужна констатация, а не падение. Про конфликт и про то, чем болел погибший, {{ c.stas.g('проговорился', 'проговорилась') }} {{ c.stas.last() }}: вспомните {{ c.stas.g('его', 'её') }} слова про «баллончик». Кто привёз погибшего — в объяснении водителя."
          - "21:18; {{ c.zavyalov.short() }}; астма; {{ c.dmitriy.short() }}."

      - id: q2
        kind: mandatory
        type: order
        prompt: "Расставьте события вечера 12 ноября в хронологическом порядке."
        items:
          - { id: k3, text: "{{ c.voroncov.last() }} проходит через служебный вход" }
          - { id: p8, text: "{{ c.volkov.last() }} проходит через служебный вход" }
          - { id: d1, text: "{{ c.volskaya.last() }} ищет {{ c.voroncov.last('acc') }}" }
          - { id: x5, text: "Начинается первый акт" }
          - { id: m2, text: "Ссора в гримёрке № {{ w.theater.dressing_room_victim }}" }
          - { id: t7, text: "Вызвана скорая помощь" }
          - { id: b9, text: "Прибывает наряд полиции" }
          - { id: r4, text: "{{ c.gromov.last() }} пытается уйти через ложи" }
        answer: { canon: [k3, p8, d1, x5, m2, t7, b9, r4] }   # ID нарочно не по порядку
        hints:
          - "У почти каждого события есть время в документах. Выпишите их в столбик."
          - "Журнал охраны (1-11) — два прихода. Опрос {{ c.volskaya.last('gen') }} — когда {{ c.volskaya.g('он искал', 'она искала') }} погибшего. Программка (1-07) — начало акта и антракт, а ссора была в антракте. Карта вызова (1-03) и рапорт (1-02) — события после падения."
          - "17:40 {{ c.voroncov.last() }} → 18:02 {{ c.volkov.last() }} → 18:20 {{ c.volskaya.last() }} → 19:00 первый акт → антракт, ссора → 21:04 скорая → 21:14 полиция → 21:20 {{ c.gromov.last() }}."

      # 30.10 (решение автора, S-151): контрольные s1.q3 (звонок, архивная запись) и s1.q4 (сайт фонда) сняты вместе с
      # подсказками. Материалы ведут вводные письма руководителя группы (docs/COVERAGE.md).

      - id: b1
        kind: bonus
        type: text
        # 28.10 (замечание автора): «Где…» → «В каком городе…» — однозначно, что вводить.
        prompt: "В каком городе, по официальной информации, {{ c.gromov.g('находился', 'находилась') }} {{ c.gromov.short() }} вечером 12 ноября?"
        leak_scan: false   # ответ законно виден на открытой странице gromov (геометка поста)
        answer:
          canon: "{{ w.neighbor_city }}"
          variants: ["{{ w.neighbor_city_pre }}", "в {{ w.neighbor_city_pre }}", "г {{ w.neighbor_city }}", "город {{ w.neighbor_city }}", "г {{ w.neighbor_city_pre }}", "в г {{ w.neighbor_city_pre }}", "город {{ w.neighbor_city_pre }}", "в городе {{ w.neighbor_city_pre }}"]   # 30.10 (S-150): + формы с «г», «город» в предложном

  # ================================================================== ЭТАП 2
  - n: 2
    envelope: 2
    intro: |
      **Коллеги,**

      справка о погибшем принята. Смерть по-прежнему выглядит естественной, и наверху этим очень довольны. Я — меньше.

      Пока у нас есть только вечер в пересказе тех, кто в нём участвовал. Пересказ гладкий: все были на своих местах, никто ничего не видел. Так гладко бывает только в программках и в тостах. Выясните, где люди были на самом деле, пока шёл спектакль.

      Вы разбирали папку — я тоже не сидел. Что запрошено и сделано со вчерашнего утра:
      - в театре — журналы помощника режиссёра и светового пульта (спектакль там расписан по минутам), запись наружной камеры над служебным входом и опись костюмерного цеха после премьеры;
      - осмотрел кабинет художественного руководителя: в антракте {{ c.voroncov.g('погибший ругался', 'погибшая ругалась') }} именно с {{ c.zavyalov.g('ним', 'ней') }};
      - в администрации города — служебный график {{ c.gromov.short('gen') }} на 12-е: сержант остановил {{ c.gromov.g('его', 'её') }} у боковой двери лож, а о ложе мы знаем со слов капельдинера;
      - {{ c.marina.short('acc') }} опросил ещё раз: ингалятор у тела в {{ c.marina.g('его', 'её') }} рассказ о здоровье {{ c.voroncov.g('крёстного', 'крёстной') }} не укладывается.

      Остальное — протоколы, которые я вчера успел снять сам: читайте их вместе с журналами. Ингалятор, который нашли у тела, теперь можно отправить в «{{ w.brands.lab }}»: основания для заявки в деле есть.

      До доклада меньше суток. Сверху просят не тянуть — я и не тяну. Работаем.

      Майор юстиции {{ c.belyaev.short() }}
    on_complete: "Ответ принят. Вскройте конверт № 3."
    questions:
      - id: q1
        kind: mandatory
        type: form
        prompt: "Восстановите перемещения охранника служебного входа с 19:00 до 20:00."
        fields:
          - id: left
            type: time
            label: "Во сколько {{ c.oleg.g('он покинул', 'она покинула') }} пост"
            answer: { canon: "19:35", tolerance_min: 2 }
          - id: back
            type: time
            label: "Во сколько {{ c.oleg.g('вернулся', 'вернулась') }}"
            answer: { canon: "19:50", tolerance_min: 2 }
        hints:
          - "{{ c.oleg.last() }} утверждает, что не {{ c.oleg.g('отходил', 'отходила') }} от поста. Проверьте это по другому источнику."
          - "Кадры наружной камеры (2-03) — время в углу кадра. Сравните с опросом охранника (2-04): что {{ c.oleg.g('он', 'она') }} говорит, когда {{ c.oleg.g('ему', 'ей') }} показывают кадры."
          - "{{ c.oleg.g('Ушёл', 'Ушла') }} в 19:35, {{ c.oleg.g('вернулся', 'вернулась') }} в 19:50."

      - id: q2
        kind: mandatory
        type: persons
        prompt: "Чьё местонахождение с 19:30 до 20:00 подтверждено независимыми источниками?"
        help: "Подтверждение — показания других людей, журналы, камеры, технические записи. Слова самого человека и то, что он сам предъявил, — не подтверждение."
        pool: [zavyalov, volkov, marina, kirill, stas, reznikova, gnedich, viktor, oleg, inna, dmitriy, volskaya, gromov]
        answer: { canon: [marina, stas, reznikova, gnedich, viktor, oleg, dmitriy, volskaya, gromov] }
        hints:
          - "Пройдитесь по каждому человеку: был ли с ним кто-то ещё, или его видно на записи?"
          - "Помогут журнал помрежа (2-05), журнал светового пульта (2-07) и кадры наружной камеры (2-03) — на них видно не только охранника, — а ещё отметки в объяснениях 1-08 и в протоколах 1-14 и 2-13 (кто был рядом с опрошенным и что сказали другие) и рапорт сержанта (1-02). Подтверждения нет у четырёх человек."
          - "Подтверждено у: {{ c.marina.last('gen') }}, {{ c.stas.last('gen') }}, {{ c.reznikova.last('gen') }}, {{ c.gnedich.last('gen') }}, {{ c.viktor.last('gen') }}, {{ c.oleg.last('gen') }}, {{ c.dmitriy.last('gen') }}, {{ c.volskaya.last('gen') }}, {{ c.gromov.last('gen') }}. Не подтверждено у: {{ c.zavyalov.last('gen') }}, {{ c.volkov.last('gen') }}, {{ c.kirill.last('gen') }}, {{ c.inna.last('gen') }}."

      # 30.10 (решение автора, S-151): контрольный s2.q3 (ингалятор, опись цеха, «Круг», опрос крестницы) снят вместе с подсказками.

      # Бонус s2.b1. 28.10 (замечание автора): прежний вопрос «почему Громова пыталась уйти» (o3 «официально — на совещании в другом
      # городе») повторял s1.b1 — снят. Путь единицы и баллы те же, вопрос новый, по материалам конверта 2: 2-17 (дублёр: «с шести часов
      # на третьем этаже, в репетиционном зале», видео) против 2-13 (около 19:50 монтировщик поднимался за дублёром: «в репетиционном
      # зале пусто, свет горит, никого»; отметка Беляева: подтвердил). Неверные опираются на реальные места документов: видео — его
      # собственное (2-17, s2.q2 help); монтировщик его как раз НЕ видел (2-13); 19:45 — звонок помрежа в костюмерный (2-05), дублёра
      # там не было; охранник в 19:35–19:50 курил на улице и никого не видел (2-04). Ответов этапов 3–4 не выдаёт.
      - id: b1
        kind: bonus
        type: choice
        prompt: "Подтверждается ли материалами конверта № 2, что весь первый акт дублёр {{ c.volkov.g('провёл', 'провела') }} в репетиционном зале?"
        options:
          - { id: video, text: "Да: это доказывает видео с {{ c.volkov.g('его', 'её') }} телефона" }
          - { id: seen, text: "Да: около 19:50 {{ c.volkov.g('его', 'её') }} там видел монтировщик" }
          - { id: shop, text: "Нет: в 19:45 {{ c.volkov.g('он был', 'она была') }} в костюмерном цехе" }
          - { id: empty, text: "Нет: около 19:50 зал был пуст, свет горел" }
          - { id: guard, text: "Нет: охранник видел {{ c.volkov.g('его', 'её') }} у служебного входа" }
        answer: { canon: empty }

      # Бонус s2.b2. 26.10 (решение автора, финальный заход): прежний вопрос «Что Инна скрывала» (брошь из костюмерной) снят
      # вместе с уликой; путь единицы и баллы те же, вопрос новый. Почему в первом акте пост пустел и кто мог знать заранее.
      # Решается документами конверта 2: 2-04 («в первом акте всегда курю… двадцать лет так»; «весь театр знает»; погибший шутил
      # «первый акт, перекур») + 2-03 (вышел сам в 19:35:12, к водителю подошёл сам в 19:44, кроме них во дворе никого).
      # Неверные: asked — 2-04 «двадцать лет так», никто не просил; driver — 2-04 «подошёл поздороваться», 2-03; chief — ни в одном
      # документе, 2-04: «вы уж начальству не говорите»; noise — 2-03: двор пуст, 2-04: «покурить».
      # Ответов не подсказывает: окно 19:35–19:50 — уже ответ s2.q1 этого этапа; «знал весь театр» никого не выделяет.
      - id: b2
        kind: bonus
        type: choice
        prompt: "Почему в первом акте {{ c.oleg.short() }} {{ c.oleg.g('оставил', 'оставила') }} пост служебного входа и кто мог знать об этом заранее?"
        options:
          # 28.10 (замечание автора): варианты одной длины, верный больше не самый подробный.
          - { id: asked, text: "Попросил{{ c.zavyalov.g('', 'а') }} выйти {{ c.zavyalov.short() }}; знали только они двое" }
          - { id: routine, text: "Курит в первом акте всегда; об этом знал весь театр" }
          - { id: driver, text: "Позвал{{ c.dmitriy.g('', 'а') }} водитель погибшего; знали только они двое" }
          - { id: chief, text: "Начальник охраны разрешил перерыв; знала только охрана" }
          - { id: noise, text: "{{ c.oleg.g('Вышел', 'Вышла') }} на шум во дворе; заранее не знал никто" }
        answer: { canon: routine }

  # ================================================================== ЭТАП 3
  - n: 3
    envelope: 3
    intro: |
      **Коллеги,**

      окно установлено: в первом акте пост служебного входа пятнадцать минут стоял пустым. Пятнадцать минут — немного. Но кое-что успеть можно.

      Теперь главный вопрос: от чего на самом деле умер {{ c.voroncov.last() }}. Версия «естественная смерть» пока держится, но уже не так уверенно, как утром. Сверху звонят всё чаще.

      Что в конверте и откуда:
      - {{ c.reznikova.short() }} — ещё раз, про отметку «20:25» в {{ c.reznikova.g('его', 'её') }} журнале: я попросил рассказать, что за ней стоит;
      - водитель и {{ c.kirill.g('друг', 'подруга') }} погибшего пришли сами, не дожидаясь вызова: водитель разрешил{{ c.dmitriy.g('', 'а') }} осмотреть машину, {{ c.kirill.g('друг принёс', 'подруга принесла') }} свой телефон — снимки экрана в деле;
      - {{ c.gromov.short() }} {{ c.gromov.g('согласился', 'согласилась') }} объяснить, что {{ c.gromov.g('он делал', 'она делала') }} в театре, — в своём кабинете и на своих условиях;
      - {{ c.volskaya.short('acc') }} опросил ещё раз: в тот вечер {{ c.volskaya.g('он искал', 'она искала') }} погибшего, и я хотел знать, нашёл{{ c.volskaya.g('', 'а') }} ли.

      Вот что не даёт мне покоя. Кровь при вскрытии отобрали, а исследовать не стали: оснований, видите ли, не нашлось. По-моему, уже нашлись. И если в тот вечер он что-то принял, я бы выяснил, что именно и откуда он это взял.

      «{{ w.brands.lab }}» ждёт ваших запросов; основания — документы. И не забывайте открытые страницы: под протокол люди говорят меньше, чем пишут.

      До доклада — одна ночь. Спать будем потом.

      Майор юстиции {{ c.belyaev.short() }}
    on_complete: "Ответ принят. Вскройте конверт № 4."
    questions:
      - id: q1
        kind: mandatory
        type: text
        # 28.10 (решение автора, отменяет правило 25.10): вопрос не говорит, что заказать, — игроки догадываются сами
        # (1-04: «образцы крови отобраны, исследование не назначалось»; письмо этапа: «Призма» ждёт запросов). Заказ — в подсказках 1–2.
        # 30.10 (S-151): письмо этапа 3 намекает догадкой руководителя: кровь не исследовали, «по-моему, основания уже нашлись».
        prompt: "Какое из веществ, обнаруженных в крови погибшего, могло вызвать смерть? Введите название вещества."
        answer:
          canon: "пропранолол"
          variants: ["пропранолола", "пропранолол гидрохлорид", "пропранолола гидрохлорид", "анаприлин", "обзидан", "propranolol", "анаприлина", "индерал"]   # 30.10 (S-150): + «анаприлина», «индерал»
        hints:
